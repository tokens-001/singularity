<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s;
        }
        
        .container {
            text-align: center;
        }
        
        #timer-display {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 40px;
            color: #333;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #start-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        #pause-btn {
            background-color: #FFC107;
            color: black;
        }
        
        #reset-btn {
            background-color: #F44336;
            color: white;
        }
        
        .mode-indicator {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .focus-mode {
            color: #4CAF50;
        }
        
        .break-mode {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="mode-indicator" class="mode-indicator focus-mode">专注时间</div>
        <div id="timer-display">25:00</div>
        <div class="controls">
            <button id="start-btn">开始</button>
            <button id="pause-btn">暂停</button>
            <button id="reset-btn">重置</button>
        </div>
    </div>

    <audio id="alert-sound" preload="auto">
        <source src="data:audio/mpeg;base64,SUQzBAAAAAABEVRYWFgAAAAtAAADY29tbWVudABCaWdTb3VuZEJhbmsuY29tIC8gTGFTb25vdGhlcXVlLm9yZwBURU5DAAAAHQAAA1N3aXRjaCBQbHVzIMKpIE5DSCBTb2Z0d2FyZQBUSVQyAAAABgAAAzIyMzUAVFNTRQAAAA8AAANMYXZmNTcuODMuMTAwAAAAAAAAAAAAAAD/80DEAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQsRbAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zQMSkAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV" type="audio/mpeg">
    </audio>

    <script>
        // 配置时间（秒）
        const FOCUS_TIME = 25 * 60; // 25分钟专注
        const BREAK_TIME = 5 * 60;  // 5分钟休息
        
        let timeLeft = FOCUS_TIME;
        let isRunning = false;
        let isFocusMode = true;
        let timerInterval = null;
        
        // DOM元素
        const timerDisplay = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modeIndicator = document.getElementById('mode-indicator');
        const alertSound = document.getElementById('alert-sound');
        const body = document.body;
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新显示
        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            
            if (isFocusMode) {
                modeIndicator.textContent = '专注时间';
                modeIndicator.className = 'mode-indicator focus-mode';
                body.style.backgroundColor = 'white';
            } else {
                modeIndicator.textContent = '休息时间';
                modeIndicator.className = 'mode-indicator break-mode';
                body.style.backgroundColor = '#e3f2fd'; // 淡蓝色背景表示休息
            }
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            timerInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    // 时间到，播放提示音
                    alertSound.play();
                    
                    // 切换模式
                    isFocusMode = !isFocusMode;
                    timeLeft = isFocusMode ? FOCUS_TIME : BREAK_TIME;
                    
                    // 更新显示
                    updateDisplay();
                } else {
                    updateDisplay();
                }
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            isFocusMode = true;
            timeLeft = FOCUS_TIME;
            updateDisplay();
        }
        
        // 事件监听
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
