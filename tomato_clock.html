<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background-color: #fafafa;
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .timer-display {
            font-size: 5em;
            font-weight: bold;
            color: #333;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .mode-selector {
            margin: 20px 0;
        }
        
        .mode-btn {
            background-color: #e0e0e0;
            color: #333;
        }
        
        .mode-btn.active {
            background-color: #2196F3;
            color: white;
        }
        
        .status {
            font-size: 1.2em;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄钟</h1>
        
        <div class="mode-selector">
            <button id="workBtn" class="mode-btn active">工作 25:00</button>
            <button id="breakBtn" class="mode-btn">休息 05:00</button>
        </div>
        
        <div class="timer-display" id="display">25:00</div>
        
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn" disabled>暂停</button>
            <button id="resetBtn">重置</button>
        </div>
        
        <div class="status" id="status">准备开始工作</div>
    </div>

    <script>
        // 定义时间常量（秒）
        const WORK_TIME = 25 * 60;  // 25分钟
        const BREAK_TIME = 5 * 60;  // 5分钟
        
        // DOM元素
        const displayEl = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const workBtn = document.getElementById('workBtn');
        const breakBtn = document.getElementById('breakBtn');
        const statusEl = document.getElementById('status');
        
        // 状态变量
        let timeLeft = WORK_TIME;
        let totalWorkTime = WORK_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isWorkMode = true;
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新显示
        function updateDisplay() {
            displayEl.textContent = formatTime(timeLeft);
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    
                    // 播放提示音（如果浏览器支持）
                    try {
                        const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFd2xqZ2VlZmlucHJ4fYSLkI6LhHx1cG1rbG5wcnR3gYWFhHt3dXNycXJzdXZ5fYCCg4SFhoeIiYuMjY6PkJGSk5SVlpeYmZqbnJ2en6ChoqOkpaanqKmqq6ytrq+wsbKztLW2t7i5uru8vb6/wMHCw8TFxsfIycrLzM3Oz9DR0tPU1dbX2Nna29zd3t/g4eLj5OXm5+jp6uvs7e7v8PHy8/T19vf4+fr7/P3+/w==');
                        audio.play().catch(e => console.log("Audio play failed:", e));
                    } catch(e) {
                        console.log("Audio creation failed:", e);
                    }
                    
                    // 切换模式并自动开始
                    if (isWorkMode) {
                        statusEl.textContent = "工作结束，开始休息";
                        switchToBreak();
                        setTimeout(() => {
                            startTimer();
                        }, 2000); // 2秒后自动开始休息
                    } else {
                        statusEl.textContent = "休息结束，开始工作";
                        switchToWork();
                        setTimeout(() => {
                            startTimer();
                        }, 2000); // 2秒后自动开始工作
                    }
                }
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            if (isWorkMode) {
                timeLeft = WORK_TIME;
            } else {
                timeLeft = BREAK_TIME;
            }
            updateDisplay();
            statusEl.textContent = isWorkMode ? "准备开始工作" : "准备开始休息";
        }
        
        // 切换到工作模式
        function switchToWork() {
            isWorkMode = true;
            timeLeft = WORK_TIME;
            totalWorkTime = WORK_TIME;
            updateDisplay();
            workBtn.classList.add('active');
            breakBtn.classList.remove('active');
            statusEl.textContent = "准备开始工作";
        }
        
        // 切换到休息模式
        function switchToBreak() {
            isWorkMode = false;
            timeLeft = BREAK_TIME;
            updateDisplay();
            breakBtn.classList.add('active');
            workBtn.classList.remove('active');
            statusEl.textContent = "准备开始休息";
        }
        
        // 事件监听器
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        workBtn.addEventListener('click', () => {
            if (!isRunning) {
                switchToWork();
            }
        });
        
        breakBtn.addEventListener('click', () => {
            if (!isRunning) {
                switchToBreak();
            }
        });
        
        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
