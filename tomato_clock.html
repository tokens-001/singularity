<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .timer-display {
            font-size: 6em;
            font-weight: 300;
            color: #333;
            margin: 20px 0;
            letter-spacing: 3px;
        }
        
        .controls {
            margin: 30px 0;
        }
        
        button {
            background-color: #fff;
            border: 2px solid #333;
            color: #333;
            cursor: pointer;
            font-size: 1.2em;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: #f0f0f0;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button.active {
            background-color: #333;
            color: #fff;
        }
        
        .status {
            font-size: 1.5em;
            color: #666;
            margin-top: 20px;
            height: 30px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #eee;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress {
            height: 100%;
            background-color: #333;
            width: 0%;
            transition: width 0.5s linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄钟</h1>
        <div class="timer-display" id="time">25:00</div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
        </div>
        <div class="status" id="status">专注时间</div>
    </div>

    <script>
        // 定义时间（秒）
        const FOCUS_TIME = 25 * 60; // 25分钟
        const BREAK_TIME = 5 * 60;  // 5分钟
        
        let timeLeft = FOCUS_TIME;
        let totalTime = FOCUS_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isFocus = true; // 当前是否为专注时间
        
        // 获取DOM元素
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDisplay = document.getElementById('status');
        const progressBar = document.getElementById('progress');
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新时间显示
        function updateTimeDisplay() {
            timeDisplay.textContent = formatTime(timeLeft);
            // 更新进度条
            const progressPercent = ((totalTime - timeLeft) / totalTime) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            timerInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    
                    // 切换模式
                    isFocus = !isFocus;
                    if (isFocus) {
                        timeLeft = FOCUS_TIME;
                        totalTime = FOCUS_TIME;
                        statusDisplay.textContent = '专注时间';
                    } else {
                        timeLeft = BREAK_TIME;
                        totalTime = BREAK_TIME;
                        statusDisplay.textContent = '休息时间';
                    }
                    
                    // 浏览器通知（如果支持）
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification(`番茄钟提醒`, {
                            body: isFocus ? '专注时间结束，开始休息吧！' : '休息时间结束，继续专注！',
                            icon: ''
                        });
                    } else if ('Notification' in window && Notification.permission !== 'denied') {
                        Notification.requestPermission().then(permission => {
                            if (permission === 'granted') {
                                new Notification(`番茄钟提醒`, {
                                    body: isFocus ? '专注时间结束，开始休息吧！' : '休息时间结束，继续专注！',
                                    icon: ''
                                });
                            }
                        });
                    }
                    
                    // 音效提醒
                    playSound();
                }
                
                updateTimeDisplay();
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
        }
        
        // 重置计时
        function resetTimer() {
            pauseTimer();
            isFocus = true;
            timeLeft = FOCUS_TIME;
            totalTime = FOCUS_TIME;
            statusDisplay.textContent = '专注时间';
            updateTimeDisplay();
        }
        
        // 播放提示音
        function playSound() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gainNode = context.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(context.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, 500);
            } catch (e) {
                console.log('音频播放失败:', e);
            }
        }
        
        // 初始化时间显示
        updateTimeDisplay();
        
        // 事件监听
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            } else if (e.code === 'KeyR') {
                resetTimer();
            }
        });
    </script>
</body>
</html>
