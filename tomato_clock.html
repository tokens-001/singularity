<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
        }
        
        #timer-display {
            font-size: 10rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 2rem;
        }
        
        .mode-indicator {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #666;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        #start-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        #pause-btn {
            background-color: #FF9800;
            color: white;
        }
        
        #reset-btn {
            background-color: #f44336;
            color: white;
        }
        
        button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mode-indicator" id="mode">专注时间</div>
        <div id="timer-display">25:00</div>
        <div class="controls">
            <button id="start-btn">开始</button>
            <button id="pause-btn" disabled>暂停</button>
            <button id="reset-btn">重置</button>
        </div>
    </div>

    <script>
        // 音频上下文用于播放提示音
        let audioContext = null;
        
        // 定义时间（秒）
        const FOCUS_TIME = 25 * 60; // 25分钟专注
        const BREAK_TIME = 5 * 60;  // 5分钟休息
        
        // 当前状态
        let timeLeft = FOCUS_TIME;
        let isRunning = false;
        let isFocusMode = true;
        let timerInterval = null;
        
        // DOM元素
        const timerDisplay = document.getElementById('timer-display');
        const modeIndicator = document.getElementById('mode');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新显示
        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            modeIndicator.textContent = isFocusMode ? '专注时间' : '休息时间';
            modeIndicator.style.color = isFocusMode ? '#4CAF50' : '#2196F3';
        }
        
        // 播放提示音
        function playSound() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
                
                setTimeout(() => {
                    oscillator.stop();
                }, 500);
            } catch (e) {
                console.log("音频播放失败:", e);
            }
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound(); // 时间到播放提示音
                    
                    // 切换模式
                    isFocusMode = !isFocusMode;
                    timeLeft = isFocusMode ? FOCUS_TIME : BREAK_TIME;
                    
                    // 自动开始下一阶段
                    setTimeout(() => {
                        startTimer();
                    }, 1000); // 延迟1秒后自动开始下一阶段
                }
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            isFocusMode = true;
            timeLeft = FOCUS_TIME;
            updateDisplay();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 事件监听器
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
