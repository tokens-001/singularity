<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background-color: #fafafa;
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .timer-display {
            font-size: 5em;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        
        .status {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 30px;
        }
        
        .controls button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .controls button:hover {
            background-color: #45a049;
        }
        
        .controls button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .work-phase {
            color: #e74c3c;
        }
        
        .break-phase {
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄钟</h1>
        <div class="status" id="status">工作时间</div>
        <div class="timer-display" id="display">25:00</div>
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn" disabled>暂停</button>
            <button id="resetBtn">重置</button>
        </div>
    </div>

    <script>
        // 配置时间（秒）
        const WORK_TIME = 25 * 60; // 25分钟
        const BREAK_TIME = 5 * 60; // 5分钟
        
        let timeLeft = WORK_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isWorkPhase = true;
        
        // 获取DOM元素
        const displayEl = document.getElementById('display');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新显示
        function updateDisplay() {
            displayEl.textContent = formatTime(timeLeft);
            if (isWorkPhase) {
                statusEl.textContent = '工作时间';
                statusEl.className = 'status work-phase';
            } else {
                statusEl.textContent = '休息时间';
                statusEl.className = 'status break-phase';
            }
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    
                    // 播放提示音（如果浏览器支持）
                    try {
                        const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFd2xqZ2RjYF1bWVdWVVRTUlFQT05MS0pJSEdGRURDQkFAPz49PDs6OTg3NjU0MzIxMC8uLSwrKikoJyYlJCMiISAfHh0cGxoZGBcWFRQTEhEQDw4NDAsKCQgHBgUEAwIBAA==');
                        audio.play().catch(e => console.log("音频播放失败:", e));
                    } catch(e) {
                        console.log("无法播放音频:", e);
                    }
                    
                    // 切换阶段
                    isWorkPhase = !isWorkPhase;
                    timeLeft = isWorkPhase ? WORK_TIME : BREAK_TIME;
                    
                    // 更新按钮状态
                    isRunning = false;
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                }
                
                updateDisplay();
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            isWorkPhase = true;
            timeLeft = WORK_TIME;
            updateDisplay();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 绑定事件
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
