<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            width: 350px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .timer-display {
            font-size: 60px;
            color: #333;
            margin: 20px 0;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        .mode-indicator {
            font-size: 24px;
            color: #555;
            margin-bottom: 20px;
        }
        
        .controls {
            margin-top: 20px;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-top: 30px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 100%;
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄钟</h1>
        <div class="mode-indicator" id="mode">专注时间</div>
        <div class="timer-display" id="display">25:00</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn" disabled>暂停</button>
            <button id="resetBtn">重置</button>
        </div>
    </div>

    <script>
        // 配置时间（秒）
        const WORK_TIME = 25 * 60;  // 25分钟
        const BREAK_TIME = 5 * 60;  // 5分钟
        
        let timeLeft = WORK_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isWorkMode = true;  // true为工作模式，false为休息模式
        
        const display = document.getElementById('display');
        const modeDisplay = document.getElementById('mode');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressFill = document.getElementById('progress');
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新显示
        function updateDisplay() {
            display.textContent = formatTime(timeLeft);
            
            // 更新进度条
            const totalTime = isWorkMode ? WORK_TIME : BREAK_TIME;
            const percentage = (timeLeft / totalTime) * 100;
            progressFill.style.width = `${percentage}%`;
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    // 时间到，切换模式
                    clearInterval(timerInterval);
                    isRunning = false;
                    
                    if (isWorkMode) {
                        alert('专注时间结束！现在开始休息吧！');
                        isWorkMode = false;
                        timeLeft = BREAK_TIME;
                        modeDisplay.textContent = '休息时间';
                    } else {
                        alert('休息时间结束！开始新的专注时间！');
                        isWorkMode = true;
                        timeLeft = WORK_TIME;
                        modeDisplay.textContent = '专注时间';
                    }
                }
                
                updateDisplay();
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 重置计时器
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            
            // 根据当前模式重置时间
            if (isWorkMode) {
                timeLeft = WORK_TIME;
            } else {
                timeLeft = BREAK_TIME;
            }
            
            updateDisplay();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 事件监听
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
