<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .timer-display {
            font-size: 6em;
            font-weight: bold;
            color: #333;
            margin: 30px 0;
            font-family: monospace;
            letter-spacing: 5px;
        }
        
        .controls {
            margin: 30px 0;
        }
        
        button {
            background-color: #ffffff;
            border: 2px solid #333;
            color: #333;
            padding: 12px 24px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 30px;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: #f5f5f5;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .status {
            font-size: 1.5em;
            color: #555;
            margin-top: 20px;
            height: 30px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 30px;
        }
        
        .progress {
            height: 100%;
            background-color: #333;
            width: 100%;
            transition: width 1s linear;
        }
        
        .mode-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .mode {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .work-mode {
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            color: #c62828;
        }
        
        .break-mode {
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
        }
        
        .current-mode {
            font-weight: bold;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄钟</h1>
        <div class="timer-display" id="timer">25:00</div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
        </div>
        <div class="status" id="status">专注时间</div>
        <div class="mode-indicator">
            <div class="mode work-mode current-mode" id="workMode">专注 25:00</div>
            <div class="mode break-mode" id="breakMode">休息 05:00</div>
        </div>
    </div>

    <script>
        // 配置时间（秒）
        const WORK_TIME = 25 * 60; // 25分钟
        const BREAK_TIME = 5 * 60;  // 5分钟
        
        // 全局变量
        let timeLeft = WORK_TIME;
        let totalDuration = WORK_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isWorkTime = true; // true表示工作时间，false表示休息时间
        
        // DOM元素
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDisplay = document.getElementById('status');
        const progressBar = document.getElementById('progress');
        const workModeElement = document.getElementById('workMode');
        const breakModeElement = document.getElementById('breakMode');
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 更新计时器显示
        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            
            // 更新进度条
            const progressPercent = (timeLeft / totalDuration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            // 更新模式标签
            workModeElement.textContent = `专注 ${formatTime(WORK_TIME)}`;
            breakModeElement.textContent = `休息 ${formatTime(BREAK_TIME)}`;
            
            if (isWorkTime) {
                workModeElement.classList.add('current-mode');
                breakModeElement.classList.remove('current-mode');
            } else {
                workModeElement.classList.remove('current-mode');
                breakModeElement.classList.add('current-mode');
            }
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            timerInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    
                    // 播放提示音（如果浏览器支持）
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        
                        oscillator.type = 'sine';
                        oscillator.frequency.value = 800;
                        gainNode.gain.value = 0.3;
                        
                        oscillator.start();
                        setTimeout(() => {
                            oscillator.stop();
                        }, 1000);
                    } catch (e) {
                        // 如果音频API不可用，则跳过
                    }
                    
                    // 切换模式
                    toggleMode();
                    
                    // 自动开始下一个计时
                    setTimeout(() => {
                        startTimer();
                    }, 1000);
                }
                
                updateDisplay();
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            isWorkTime = true;
            timeLeft = WORK_TIME;
            totalDuration = WORK_TIME;
            statusDisplay.textContent = '专注时间';
            updateDisplay();
        }
        
        // 切换工作/休息模式
        function toggleMode() {
            isWorkTime = !isWorkTime;
            
            if (isWorkTime) {
                timeLeft = WORK_TIME;
                totalDuration = WORK_TIME;
                statusDisplay.textContent = '专注时间';
            } else {
                timeLeft = BREAK_TIME;
                totalDuration = BREAK_TIME;
                statusDisplay.textContent = '休息时间';
            }
            
            updateDisplay();
        }
        
        // 初始化显示
        updateDisplay();
        
        // 事件监听器
        startBtn.addEventListener('click', () => {
            startTimer();
        });
        
        pauseBtn.addEventListener('click', () => {
            pauseTimer();
        });
        
        resetBtn.addEventListener('click', () => {
            resetTimer();
        });
        
        // 键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            } else if (e.code === 'KeyR') {
                resetTimer();
            }
        });
    </script>
</body>
</html>
