<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #333;
        }
        
        .timer-display {
            font-size: 6rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 40px;
            font-family: 'Courier New', monospace;
        }
        
        .mode-indicator {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #666;
            height: 30px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }
        
        #startPauseBtn {
            background-color: #4CAF50;
            color: white;
        }
        
        #startPauseBtn:hover {
            background-color: #45a049;
        }
        
        #resetBtn {
            background-color: #f44336;
            color: white;
        }
        
        #resetBtn:hover {
            background-color: #da190b;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        @media (max-width: 600px) {
            .timer-display {
                font-size: 4rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            button {
                padding: 12px 20px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄钟</h1>
        <div class="mode-indicator" id="modeIndicator">专注时间</div>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="controls">
            <button id="startPauseBtn">开始</button>
            <button id="resetBtn">重置</button>
        </div>
    </div>

    <script>
        // 配置时间（秒）
        const FOCUS_TIME = 25 * 60; // 25分钟专注
        const BREAK_TIME = 5 * 60;  // 5分钟休息
        
        // DOM元素
        const timerDisplay = document.getElementById('timerDisplay');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modeIndicator = document.getElementById('modeIndicator');
        
        // 状态变量
        let timeLeft = FOCUS_TIME;
        let isRunning = false;
        let intervalId = null;
        let isFocusMode = true; // true为专注，false为休息
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新显示
        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            modeIndicator.textContent = isFocusMode ? '专注时间' : '休息时间';
        }
        
        // 开始/暂停功能
        function toggleTimer() {
            if (isRunning) {
                // 暂停
                clearInterval(intervalId);
                isRunning = false;
                startPauseBtn.textContent = '开始';
            } else {
                // 开始
                if (timeLeft <= 0) return; // 时间到了不能继续
                
                isRunning = true;
                startPauseBtn.textContent = '暂停';
                
                intervalId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    
                    if (timeLeft <= 0) {
                        // 播放提示音
                        playBeep();
                        
                        // 切换模式
                        if (isFocusMode) {
                            // 从专注切换到休息
                            isFocusMode = false;
                            timeLeft = BREAK_TIME;
                        } else {
                            // 从休息切换到专注
                            isFocusMode = true;
                            timeLeft = FOCUS_TIME;
                        }
                        
                        updateDisplay();
                        clearInterval(intervalId);
                        isRunning = false;
                        startPauseBtn.textContent = '开始';
                    }
                }, 1000);
            }
        }
        
        // 重置功能
        function resetTimer() {
            clearInterval(intervalId);
            isRunning = false;
            isFocusMode = true;
            timeLeft = FOCUS_TIME;
            updateDisplay();
            startPauseBtn.textContent = '开始';
        }
        
        // 播放提示音（使用Web Audio API生成简单蜂鸣声）
        function playBeep() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, 500);
            } catch (e) {
                // 如果浏览器不支持Web Audio API，则忽略
                console.log('音频API不可用，跳过提示音');
            }
        }
        
        // 初始化
        updateDisplay();
        
        // 事件监听器
        startPauseBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
    </script>
</body>
</html>
