<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        
        .timer-display {
            font-size: 6em;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        
        .status {
            font-size: 1.5em;
            color: #555;
            margin-bottom: 30px;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .controls {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄钟</h1>
        <div class="status" id="status">专注时间</div>
        <div class="timer-display" id="display">25:00</div>
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn" disabled>暂停</button>
            <button id="resetBtn">重置</button>
        </div>
    </div>

    <script>
        // 番茄钟配置
        const POMODORO_TIME = 25 * 60; // 25分钟专注
        const BREAK_TIME = 5 * 60;     // 5分钟休息
        
        let timeLeft = POMODORO_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isBreak = false;
        
        // 获取DOM元素
        const displayElement = document.getElementById('display');
        const statusElement = document.getElementById('status');
        const startButton = document.getElementById('startBtn');
        const pauseButton = document.getElementById('pauseBtn');
        const resetButton = document.getElementById('resetBtn');
        
        // 格式化时间为 MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 更新显示
        function updateDisplay() {
            displayElement.textContent = formatTime(timeLeft);
        }
        
        // 开始计时
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startButton.disabled = true;
            pauseButton.disabled = false;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // 切换到休息或专注
                    isBreak = !isBreak;
                    timeLeft = isBreak ? BREAK_TIME : POMODORO_TIME;
                    
                    // 更新状态
                    statusElement.textContent = isBreak ? '休息时间' : '专注时间';
                    
                    // 播放提示音
                    playNotificationSound();
                    
                    // 自动开始下一阶段
                    setTimeout(() => {
                        startTimer();
                    }, 1000);
                }
            }, 1000);
        }
        
        // 暂停计时
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            startButton.disabled = false;
            pauseButton.disabled = true;
        }
        
        // 重置计时器
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = POMODORO_TIME;
            
            statusElement.textContent = '专注时间';
            updateDisplay();
            
            startButton.disabled = false;
            pauseButton.disabled = true;
        }
        
        // 播放提示音
        function playNotificationSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, 500);
            } catch (e) {
                // 如果浏览器不支持Web Audio API，则跳过声音
            }
        }
        
        // 初始化显示
        updateDisplay();
        
        // 绑定事件
        startButton.addEventListener('click', startTimer);
        pauseButton.addEventListener('click', pauseTimer);
        resetButton.addEventListener('click', resetTimer);
    </script>
</body>
</html>
