<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 100%);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 28px;
            font-weight: 700;
        }

        .timer-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 32px;
        }

        .timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-track {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 8;
        }

        .timer-progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.35s linear, stroke 0.35s ease;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 28px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-start {
            background: #10b981;
            color: white;
            min-width: 110px;
        }

        .btn-start:hover {
            background: #059669;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-reset {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-reset:hover {
            background: #e2e8f0;
        }

        .stats {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            color: #475569;
            font-weight: 600;
        }

        .tomato-icon {
            font-size: 22px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            .timer-wrapper {
                width: 220px;
                height: 220px;
            }

            .timer-text {
                font-size: 80px;
            }

            h1 {
                font-size: 24px;
            }

            button {
                padding: 12px 22px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>番茄钟</h1>
        <div class="timer-wrapper">
            <svg class="timer-svg" viewBox="0 0 260 260">
                <circle class="timer-track" cx="130" cy="130" r="120"></circle>
                <circle
                    class="timer-progress"
                    id="progressCircle"
                    cx="130"
                    cy="130"
                    r="120"
                    stroke-dasharray="753.98"
                    stroke-dashoffset="0"
                    stroke="#22c55e"
                ></circle>
            </svg>
            <div class="timer-text" id="timerDisplay">25:00</div>
        </div>
        <div class="controls">
            <button class="btn-start" id="toggleBtn">开始</button>
            <button class="btn-reset" id="resetBtn">重置</button>
        </div>
        <div class="stats">
            <span class="tomato-icon">🍅</span>
            <span id="statsText">已完成 0 个番茄</span>
        </div>
    </div>

    <script>
        const WORK_TIME = 25 * 60;
        const CIRCLE_RADIUS = 120;
        const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

        let totalSeconds = WORK_TIME;
        let remainingSeconds = WORK_TIME;
        let timerInterval = null;
        let isRunning = false;
        let completedCount = 0;

        const timerDisplay = document.getElementById('timerDisplay');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressCircle = document.getElementById('progressCircle');
        const statsText = document.getElementById('statsText');

        progressCircle.style.strokeDasharray = `${CIRCLE_CIRCUMFERENCE} ${CIRCLE_CIRCUMFERENCE}`;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateTitle() {
            document.title = isRunning ? `${formatTime(remainingSeconds)} - 番茄钟` : '番茄钟';
        }

        function getProgressColor(ratio) {
            if (ratio <= 5 / 25) {
                return '#ef4444';
            }
            if (ratio <= 0.5) {
                return '#f59e0b';
            }
            return '#22c55e';
        }

        function updateUI() {
            const displayTime = formatTime(remainingSeconds);
            timerDisplay.textContent = displayTime;

            const ratio = remainingSeconds / totalSeconds;
            const offset = CIRCLE_CIRCUMFERENCE * (1 - ratio);
            progressCircle.style.strokeDashoffset = offset;
            progressCircle.style.stroke = getProgressColor(ratio);

            updateTitle();
        }

        function playBeep() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, ctx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);

                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.error('播放提示音失败:', e);
            }
        }

        function onComplete() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            remainingSeconds = 0;
            toggleBtn.textContent = '开始';
            completedCount += 1;
            statsText.textContent = `已完成 ${completedCount} 个番茄`;
            updateUI();
            playBeep();
            setTimeout(() => {
                alert('时间到！');
            }, 100);
        }

        function tick() {
            remainingSeconds -= 1;
            if (remainingSeconds <= 0) {
                onComplete();
                return;
            }
            updateUI();
        }

        function startTimer() {
            if (remainingSeconds <= 0) {
                remainingSeconds = totalSeconds;
            }
            isRunning = true;
            toggleBtn.textContent = '暂停';
            updateUI();
            timerInterval = setInterval(tick, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            toggleBtn.textContent = '继续';
            clearInterval(timerInterval);
            timerInterval = null;
            updateUI();
        }

        function resetTimer() {
            isRunning = false;
            toggleBtn.textContent = '开始';
            clearInterval(timerInterval);
            timerInterval = null;
            remainingSeconds = totalSeconds;
            updateUI();
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', resetTimer);

        updateUI();
    </script>
</body>
</html>
