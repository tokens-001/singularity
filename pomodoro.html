<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        .timer-display {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .mode-display {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }
        
        .controls {
            display: flex;
            gap: 20px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #startPauseBtn {
            background-color: #4CAF50;
            color: white;
        }
        
        #resetBtn {
            background-color: #f44336;
            color: white;
        }
        
        .focus-mode {
            color: #e91e63;
        }
        
        .break-mode {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="mode-display" id="modeDisplay">专注时间</div>
    <div class="timer-display" id="timerDisplay">25:00</div>
    <div class="controls">
        <button id="startPauseBtn">开始</button>
        <button id="resetBtn">重置</button>
    </div>

    <script>
        // 配置时间（分钟）
        const FOCUS_TIME = 25 * 60; // 专注时间（秒）
        const BREAK_TIME = 5 * 60;  // 休息时间（秒）
        
        let timeLeft = FOCUS_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isFocusMode = true;
        
        // 获取DOM元素
        const timerDisplay = document.getElementById('timerDisplay');
        const modeDisplay = document.getElementById('modeDisplay');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 更新显示
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${minutes}:${seconds}`;
            
            if (isFocusMode) {
                modeDisplay.textContent = '专注时间';
                modeDisplay.className = 'mode-display focus-mode';
            } else {
                modeDisplay.textContent = '休息时间';
                modeDisplay.className = 'mode-display break-mode';
            }
        }
        
        // 播放提示音
        function playSound() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gainNode = context.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(context.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, 500);
            } catch (e) {
                console.log('音频播放失败:', e);
            }
        }
        
        // 开始/暂停计时器
        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }
        
        // 开始计时器
        function startTimer() {
            if (!isRunning) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    
                    if (timeLeft <= 0) {
                        // 切换模式
                        isFocusMode = !isFocusMode;
                        timeLeft = isFocusMode ? FOCUS_TIME : BREAK_TIME;
                        
                        // 播放提示音
                        playSound();
                    }
                    
                    updateDisplay();
                }, 1000);
                
                isRunning = true;
                startPauseBtn.textContent = '暂停';
            }
        }
        
        // 暂停计时器
        function pauseTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                startPauseBtn.textContent = '继续';
            }
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            isFocusMode = true;
            timeLeft = FOCUS_TIME;
            updateDisplay();
            startPauseBtn.textContent = '开始';
        }
        
        // 初始化显示
        updateDisplay();
        
        // 绑定事件
        startPauseBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
    </script>
</body>
</html>
