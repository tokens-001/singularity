repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        files: ^src/singularity/
        additional_dependencies: [Flask, httpx]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/unit_tests.py -q
        language: system
        types: [python]
        pass_filenames: false
