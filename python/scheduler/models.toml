# 模型能力注册表
# [[models]] 数组格式，支持 model id 里的点号 (如 kimi-k2.7-code)
# provider 对应 api_store 里的 api_id

[[models]]
id = "deepseek-chat"
provider = "deepseek"
display = "DeepSeek V3 (Chat)"
tiers = ["E"]
speed = "fast"
cost = "budget"
reasoning = true
max_turns = 5
strengths = ["日常编码", "bugfix", "查询"]
notes = "最便宜的 E 层首选。推理模型(reasoning_content)。适合简单单文件任务。"

[[models]]
id = "deepseek-v4-pro"
