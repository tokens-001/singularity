[dual]
models = ["qwen3-coder-next", "kimi-k2.7-code-highspeed"]
roles = ["builder", "skeptic"]
judge_model = "qwen3-coder-next"
call_model = "qwen3-coder-next"
max_tokens = 2000
temperature = 0.7
timeout_sec = 60

[triple]
models = ["qwen3-coder-plus", "kimi-k2.6", "gpt-5.5"]
roles = ["builder", "skeptic", "analyst"]
judge_model = "qwen3-coder-plus"
call_model = "kimi-k2.6"
max_tokens = 2000
temperature = 0.7
timeout_sec = 60

[super]
models = ["qwen3.7-max", "claude-opus-4-8", "gpt-5.5-pro"]
roles = ["builder", "skeptic", "analyst"]
judge_model = "gpt-5.5-pro"
call_model = "claude-opus-4-8"
max_tokens = 4000
temperature = 0.7
timeout_sec = 120

[super.detail]
description = "N模型 × 多视角 × 对抗验证 × 迭代熔合 × 人工卡点"

[auto]
trigger_types = ["fusion", "refactor"]
min_priority = 50
min_task_length = 30

[tier_routing]
simple = "dual"
complex = "triple"
critical = "super"

[execution]
mode = "two_phase"

[custom]
models = ["deepseek-chat", "kimi-k2.7-code"]
judge_model = "glm-5-turbo"
call_model = "deepseek-chat"

[roles]
builder = "你是 Builder（建设者）。关注可实现性、具体步骤、代码结构、模块划分。给出可落地的方案。"
skeptic = "你是 Skeptic（质疑者）。主动找方案的漏洞：边界条件、并发安全、异常路径、向后兼容。指出所有可能出错的地方。"
analyst = "你是 Analyst（分析者）。关注架构合理性、技术选型权衡、长期维护成本。从更高维度评估方案。"
