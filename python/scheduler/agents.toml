# Agent 注册表
#
# type 分叉:
#   claude-cli   → ClaudeCliExecutor (Claude Code CLI, 自带agent能力)
#   openai-agent → OpenAIAgentExecutor (通用agent runtime, 不依赖Claude Code)
#   zhipu-api    → ZhipuApiExecutor (单轮API, 兼容旧配置)
#
# sandbox = "worktree" → orchestrator 创建 git worktree 隔离
# mode = "planner"     → 只读分析, worktree 文件锁只读

# ═══ E 层: 日常执行 (4个agent, 按价格从低到高排列) ═══

# E层子模型1: DeepSeek V4 Flash — 最便宜($0.14/M), 日常快速任务首选
[[agents.E]]
model = "deepseek-v4-flash"
type = "openai-agent"
entry = "https://api.deepseek.com/v1/chat/completions"
api_key_env = "DEEPSEEK_API_KEY"
max_turns = 5
default = false
roles = ["daily"]
sandbox = "worktree"

[agents.E.request_template]
model = "deepseek-v4-flash"
max_tokens = 4096

# E层子模型2: GLM-5-turbo — 便宜推理模型, 第二选择
[[agents.E]]
model = "glm-5-turbo"
type = "openai-agent"
entry = "https://open.bigmodel.cn/api/paas/v4/chat/completions"
api_key_env = "ZHIPU_API_KEY"
max_turns = 5
default = false
roles = ["daily"]
sandbox = "worktree"

[agents.E.request_template]
model = "glm-5-turbo"
max_tokens = 4096

# Kimi K2.7 — E层第三选择, 推理模型
[[agents.E]]
model = "kimi-k2.7-code"
type = "openai-agent"
entry = "https://api.moonshot.cn/v1/chat/completions"
api_key_env = "KIMI_API_KEY"
max_turns = 5
default = false
roles = ["daily"]
sandbox = "worktree"

[agents.E.request_template]
model = "kimi-k2.7-code"
max_tokens = 4096

# DeepSeek V4 Pro — E层主力(Claude Code CLI), 默认
[[agents.E]]
model = "deepseek-v4-pro"
type = "claude-cli"
entry = "/Users/jingzhe/.claude/local/claude --exclude-dynamic-system-prompt-sections -p {prompt}"
max_turns = 2
default = true
roles = ["daily"]
sandbox = "worktree"

# ═══ E+ 层: 复杂构建 ═══

[[agents.E_plus]]
model = "glm-5.2"
type = "openai-agent"
entry = "https://open.bigmodel.cn/api/paas/v4/chat/completions"
api_key_env = "ZHIPU_API_KEY"
max_turns = 8
default = true
roles = ["builder"]
sandbox = "worktree"

[agents.E_plus.request_template]
model = "glm-5.2"
temperature = 0.3
max_tokens = 4096

# ═══ D 层: 架构设计 ═══

[[agents.D]]
model = "claude-opus-4-8"
type = "claude-cli"
entry = "/opt/homebrew/bin/claude --model claude-opus-4-8 -p {prompt}"
max_turns = 2
default = true
roles = ["architecture", "security-review"]
mode = "planner"
sandbox = "worktree"

[agents.D.env]
ANTHROPIC_API_KEY = "{ANTHROPIC_API_KEY}"
HTTPS_PROXY = "http://127.0.0.1:7892"

[agents.D.env_unset]
keys = ["ANTHROPIC_BASE_URL", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_MODEL"]

# GPT-5.5 — D层强力 (via OpenAI API, 需代理)
[[agents.D]]
model = "gpt-5.5"
type = "openai-agent"
entry = "https://api.openai.com/v1/chat/completions"
api_key_env = "OPENAI_API_KEY"
max_turns = 5
default = false
roles = ["architecture"]
sandbox = "worktree"

[agents.D.request_template]
model = "gpt-5.5"
max_completion_tokens = 4096

[agents.D.env]
HTTPS_PROXY = "http://127.0.0.1:7892"

# GLM-5.2 — D层备选 (Opus欠费时顶上)
[[agents.D]]
model = "glm-5.2"
type = "openai-agent"
entry = "https://open.bigmodel.cn/api/paas/v4/chat/completions"
api_key_env = "ZHIPU_API_KEY"
max_turns = 8
default = false
roles = ["architecture"]
sandbox = "worktree"

[agents.D.request_template]
model = "glm-5.2"
temperature = 0.3
max_tokens = 4096
