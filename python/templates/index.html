<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇点 Agent 调度平台</title>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text2: #8b949e;
  --blue: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d2991d;
  --purple: #a371f7;
  --cyan: #39d2c0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
  background: var(--bg); color: var(--text);
  line-height: 1.5; padding: 16px;
}
h1 { font-size: 20px; margin-bottom: 4px; }
h2 { font-size: 14px; color: var(--text2); margin-bottom: 16px; font-weight: normal; }
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.refresh { font-size: 12px; color: var(--text2); }
.refresh.live { color: var(--green); }

/* ── Status Cards ── */
.cards { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px; min-width: 100px; flex: 1;
}
.card .count { font-size: 28px; font-weight: bold; }
.card .label { font-size: 11px; color: var(--text2); margin-top: 2px; }
.card.pending .count { color: var(--blue); }
.card.running .count { color: var(--cyan); animation: pulse 1.5s infinite; }
.card.done .count { color: var(--green); }
.card.failed .count { color: var(--red); }
.card.conflict .count { color: var(--orange); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Sections ── */
.section {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 16px; overflow: hidden;
}
.section-title {
  font-size: 13px; font-weight: bold; padding: 10px 16px;
  background: var(--bg3); border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.section-body { padding: 12px 16px; }

/* ── Agent Load ── */
.agent-loads { display: flex; gap: 16px; }
.agent-load {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
}
.agent-load .dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.agent-load .dot.e { background: var(--cyan); }
.agent-load .dot.d { background: var(--purple); }
.agent-load .dot.ep { background: var(--orange); }

/* ── Table ── */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; background: var(--bg3); color: var(--text2); font-weight: normal; font-size: 11px; text-transform: uppercase; }
td { padding: 6px 12px; border-top: 1px solid var(--border); }
tr:hover { background: rgba(88,166,255,.05); cursor: pointer; }
tr.expanded { background: rgba(88,166,255,.08); }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 11px; font-weight: bold;
}
.badge.pending { background: rgba(88,166,255,.15); color: var(--blue); }
.badge.routed { background: rgba(88,166,255,.2); color: var(--blue); }
.badge.dispatched { background: rgba(163,113,247,.2); color: var(--purple); }
.badge.running { background: rgba(57,210,192,.2); color: var(--cyan); }
.badge.validating { background: rgba(163,113,247,.2); color: var(--purple); }
.badge.done { background: rgba(63,185,80,.15); color: var(--green); }
.badge.failed { background: rgba(248,81,73,.15); color: var(--red); }
.badge.rolled_back { background: rgba(248,81,73,.1); color: var(--red); }
.badge.decomposed { background: rgba(210,153,29,.15); color: var(--orange); }
.badge.blocked { background: rgba(139,148,158,.15); color: var(--text2); }
.badge.conflict_held { background: rgba(210,153,29,.2); color: var(--orange); }

.level-tag {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: 10px; font-weight: bold; margin-left: 4px;
}
.level-tag.e { background: rgba(57,210,192,.2); color: var(--cyan); }
.level-tag.d { background: rgba(163,113,247,.2); color: var(--purple); }
.level-tag.ep { background: rgba(210,153,29,.2); color: var(--orange); }

/* ── Detail Panel ── */
.detail { display: none; }
.detail.open { display: table-row; }
.detail td { padding: 16px 20px; background: rgba(0,0,0,.2); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font-size: 13px; }
.detail-grid dt { color: var(--text2); font-size: 11px; }
.detail-grid dd { margin-bottom: 8px; word-break: break-all; }
.detail-actions { margin-top: 12px; display: flex; gap: 8px; }
.dag-tree { font-family: monospace; font-size: 12px; white-space: pre; color: var(--text2); }
.error-block { background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); border-radius: 4px; padding: 8px 12px; margin-top: 8px; font-size: 12px; max-height: 120px; overflow-y: auto; }

/* ── Buttons ── */
.btn {
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--text); cursor: pointer; font-size: 12px;
  font-family: inherit;
}
.btn:hover { background: var(--border); }
.btn.primary { background: var(--blue); color: #000; border-color: var(--blue); }
.btn.primary:hover { opacity: .8; }
.btn.danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn.small { padding: 3px 8px; font-size: 11px; }

/* ── Forms ── */
.form-row { display: flex; gap: 8px; }
textarea, input, select {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 12px; color: var(--text);
  font-family: inherit; font-size: 13px; width: 100%;
}
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--blue); }
textarea { resize: vertical; min-height: 60px; }
select { width: auto; }

/* ── Filter Bar ── */
.filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.filter-bar select { width: auto; }

/* ── Memory Panel ── */
.mem-card { font-size: 12px; margin-bottom: 8px; }
.mem-card .source { color: var(--text2); font-size: 10px; }
.mem-card .sim { color: var(--blue); }

/* ── Trace View ── */
.trace-modal {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.7); z-index: 100; overflow-y: auto;
}
.trace-modal.open { display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
.trace-content {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px; max-width: 800px; width: 100%;
}
.trace-content pre { white-space: pre-wrap; font-size: 12px; max-height: 500px; overflow-y: auto; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .cards { flex-direction: column; }
  .detail-grid { grid-template-columns: 1fr; }
  .agent-loads { flex-direction: column; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚡ 奇点 Agent 调度平台</h1>
    <h2 id="clock">加载中...</h2>
  </div>
  <div class="refresh live" id="refresh-indicator">● 实时</div>
</div>

<!-- Status Cards -->
<div class="cards" id="status-cards"></div>

<!-- Agent Load + Timing -->
<div class="section">
  <div class="section-title">Agent 负载</div>
  <div class="section-body">
    <div class="agent-loads" id="agent-loads"></div>
    <div style="margin-top:8px;font-size:12px;color:var(--text2)" id="timing-stats"></div>
  </div>
</div>

<!-- Token Stats -->
<div class="section" id="token-section" style="display:none">
  <div class="section-title">Token 消耗</div>
  <div class="section-body" id="token-stats"></div>
</div>

<!-- Task Table -->
<div class="section">
  <div class="section-title">
    <span>任务列表 <span style="color:var(--text2);font-weight:normal" id="task-count"></span></span>
    <div style="display:flex;gap:8px">
      <button class="btn small" onclick="refreshAll()">↻ 刷新</button>
    </div>
  </div>
  <div class="section-body">
    <div class="filter-bar">
      <select id="filter-status" onchange="renderTasks()">
        <option value="">全部状态</option>
      </select>
      <select id="filter-level" onchange="renderTasks()">
        <option value="">全部级别</option>
        <option value="E">E (DeepSeek)</option>
        <option value="D">D (Opus)</option>
        <option value="E+">E+ (GLM)</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>描述</th>
          <th>状态</th>
          <th>级别</th>
          <th>等待</th>
        </tr>
      </thead>
      <tbody id="task-table"></tbody>
    </table>
  </div>
</div>

<!-- New Task -->
<div class="section">
  <div class="section-title">新建任务</div>
  <div class="section-body">
    <div class="form-row">
      <textarea id="new-task-desc" placeholder="输入任务描述..."></textarea>
      <button class="btn primary" onclick="submitTask()" style="flex-shrink:0">提交</button>
    </div>
  </div>
</div>

<!-- Conflicts -->
<div class="section" id="conflict-section" style="display:none">
  <div class="section-title" style="color:var(--orange)">⚠ 合并冲突</div>
  <div class="section-body" id="conflict-list"></div>
</div>

<!-- Memory Query -->
<div class="section">
  <div class="section-title">🧠 MAGMA 多图记忆</div>
  <div class="section-body">
    <div class="form-row" style="margin-bottom:8px">
      <input id="mem-query" placeholder="查询记忆（描述或文件名）..." onkeydown="if(event.key==='Enter')queryMemory()">
      <button class="btn" onclick="queryMemory()">搜索</button>
    </div>
    <div id="mem-stats" style="font-size:11px;color:var(--text2);margin-bottom:8px"></div>
    <div id="mem-results"></div>
  </div>
</div>

<!-- Trace Modal -->
<div class="trace-modal" id="trace-modal" onclick="if(event.target===this)closeTrace()">
  <div class="trace-content" id="trace-content"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════
let tasks = [];
let statusData = {};
let conflicts = [];
let expandedTask = null;

const STATUS_MAP = {
  pending:'待处理',routed:'已路由',dispatched:'已分发',
  running:'运行中',validating:'验证中',done:'完成',
  failed:'失败',rolled_back:'已回滚',decomposed:'已分解',
  blocked:'阻塞',conflict_held:'冲突'
};

// ═══════════════════════════════════════════════════════
// API calls
// ═══════════════════════════════════════════════════════
async function api(path, opts) {
  try {
    const r = await fetch(path, opts);
    return await r.json();
  } catch(e) { return {error: e.message}; }
}

// ═══════════════════════════════════════════════════════
// Refresh
// ═══════════════════════════════════════════════════════
async function refreshAll() {
  const ind = document.getElementById('refresh-indicator');
  ind.className = 'refresh live';
  ind.textContent = '● 刷新中...';

  const [s, t, c] = await Promise.all([
    api('/api/status'),
    api('/api/tasks'),
    api('/api/conflicts'),
  ]);

  statusData = s;
  tasks = t.tasks || [];
  conflicts = c.conflicts || [];

  renderStatusCards();
  renderAgentLoads();
  renderTiming();
  renderTokens();
  renderTasks();
  renderConflicts();
  updateClock();

  ind.textContent = '● 实时';
}

// ═══════════════════════════════════════════════════════
// Status Cards
// ═══════════════════════════════════════════════════════
function renderStatusCards() {
  const counts = statusData.counts || {};
  const cards = [
    {key:'pending',label:'待处理',cls:'pending'},
    {key:'running',label:'运行中',cls:'running',use:statusData.running_total||0},
    {key:'done',label:'已完成',cls:'done'},
    {key:'failed',label:'失败',cls:'failed'},
    {key:'conflict_held',label:'冲突',cls:'conflict'},
  ];

  document.getElementById('status-cards').innerHTML = cards.map(c => {
    const n = c.use !== undefined ? c.use : (counts[c.key]||0);
    return `<div class="card ${c.cls}"><div class="count">${n}</div><div class="label">${c.label}</div></div>`;
  }).join('');

  // Populate filter dropdown
  const sel = document.getElementById('filter-status');
  if (sel.options.length <= 1) {
    const allStatuses = [...new Set(tasks.map(t=>t.status))].sort();
    allStatuses.forEach(s => {
      if (!sel.querySelector(`[value="${s}"]`)) {
        const o = document.createElement('option');
        o.value = s; o.textContent = STATUS_MAP[s] || s;
        sel.appendChild(o);
      }
    });
  }
}

// ═══════════════════════════════════════════════════════
// Agent Loads
// ═══════════════════════════════════════════════════════
function renderAgentLoads() {
  const agents = statusData.agents || {};
  const loads = statusData.heartbeat_levels || {};
  document.getElementById('agent-loads').innerHTML = ['E','D','E+'].map(l => {
    const n = loads[l] || 0;
    const model = agents[l] && agents[l][0] ? agents[l][0].model : '';
    const cls = l==='E'?'e':l==='D'?'d':'ep';
    return `<div class="agent-load"><span class="dot ${cls}"></span> ${l} (${model}): <b>${n}</b> 个任务</div>`;
  }).join('');
}

function renderTiming() {
  document.getElementById('timing-stats').textContent =
    `平均等待: ${statusData.avg_wait||'--'} | 平均完成: ${statusData.avg_done||'--'}` +
    (statusData.stalled && statusData.stalled.length ? ` | ⚠ 卡住: ${statusData.stalled.join(', ')}` : '');
}

function renderTokens() {
  const tt = statusData.token_totals;
  if (!tt || !Object.keys(tt).length) {
    document.getElementById('token-section').style.display = 'none';
    return;
  }
  document.getElementById('token-section').style.display = '';
  const total = Object.values(tt).reduce((a,b)=>a+b,0);
  document.getElementById('token-stats').innerHTML =
    `<b>总计:</b> ${fmtTokens(total)} &nbsp; ` +
    Object.entries(tt).map(([l,t]) => `${l}: ${fmtTokens(t)}`).join(' | ');
}

function fmtTokens(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return Math.round(n/1e3)+'K';
  return String(n);
}

// ═══════════════════════════════════════════════════════
// Task Table
// ═══════════════════════════════════════════════════════
function renderTasks() {
  const fs = document.getElementById('filter-status').value;
  const fl = document.getElementById('filter-level').value;

  let filtered = tasks;
  if (fs) filtered = filtered.filter(t => t.status === fs);
  if (fl) filtered = filtered.filter(t => t.route_level === fl);

  document.getElementById('task-count').textContent = `(${filtered.length} 条)`;

  const tbody = document.getElementById('task-table');
  tbody.innerHTML = filtered.map(t => {
    const idShort = t.id ? t.id.slice(-8) : '?';
    const desc = (t.description||'').slice(0,80);
    const status = STATUS_MAP[t.status] || t.status || '?';
    const wait = t.wait_sec != null ? fmtDur(t.wait_sec) : '--';
    const lvl = t.route_level || '';
    const lvlCls = lvl==='E'?'e':lvl==='D'?'d':lvl==='E+'?'ep':'';

    return `
      <tr onclick="toggleDetail('${t.id}')" id="row-${t.id}">
        <td style="font-family:monospace;font-size:11px">${idShort}</td>
        <td>${esc(desc)}</td>
        <td><span class="badge ${t.status}">${status}</span></td>
        <td>${lvl?`<span class="level-tag ${lvlCls}">${lvl}</span>`:'--'}</td>
        <td style="font-size:11px;color:var(--text2)">${wait}</td>
      </tr>
      <tr class="detail" id="detail-${t.id}"><td colspan="5"></td></tr>
    `;
  }).join('') || '<tr><td colspan="5" style="color:var(--text2);text-align:center;padding:20px">暂无任务</td></tr>';
}

async function toggleDetail(taskId) {
  const detailRow = document.getElementById('detail-' + taskId);
  const row = document.getElementById('row-' + taskId);

  if (detailRow.classList.contains('open')) {
    detailRow.classList.remove('open');
    row.classList.remove('expanded');
    expandedTask = null;
  } else {
    // Close previous
    if (expandedTask) {
      const prev = document.getElementById('detail-' + expandedTask);
      if (prev) prev.classList.remove('open');
      const prevRow = document.getElementById('row-' + expandedTask);
      if (prevRow) prevRow.classList.remove('expanded');
    }
    expandedTask = taskId;
    row.classList.add('expanded');

    // Fetch detail
    const data = await api('/api/tasks/' + taskId);
    if (data.error) {
      detailRow.querySelector('td').innerHTML = `<div class="error-block">${esc(data.error)}</div>`;
      detailRow.classList.add('open');
      return;
    }

    const parents = (data._dag_parents||[]).map(p =>
      `${p.id.slice(-8)} ${esc((p.description||'').slice(0,30))} [${STATUS_MAP[p.status]||p.status}]`
    );
    const children = (data._dag_children||[]).map(c =>
      `${c.id.slice(-8)} ${esc((c.description||'').slice(0,30))} [${STATUS_MAP[c.status]||c.status}]`
    );

    const created = data.created_at ? new Date(data.created_at*1000).toLocaleString('zh-CN') : '--';
    const updated = data.updated_at ? new Date(data.updated_at*1000).toLocaleString('zh-CN') : '--';

    detailRow.querySelector('td').innerHTML = `
      <div class="detail-grid">
        <div><dt>任务 ID</dt><dd style="font-family:monospace">${data.id||taskId}</dd></div>
        <div><dt>状态</dt><dd><span class="badge ${data.status}">${STATUS_MAP[data.status]||data.status}</span></dd></div>
        <div><dt>描述</dt><dd>${esc(data.description||'')}</dd></div>
        <div><dt>路由级别</dt><dd>${data.route_level||'--'} ${data.route_locked?'🔒':''}</dd></div>
        <div><dt>任务类型</dt><dd>${data.route_type||'--'}</dd></div>
        <div><dt>优先级</dt><dd>${data.priority||0}</dd></div>
        <div><dt>重试</dt><dd>${data.retry_count||0}/${data.max_retries||3}</dd></div>
        <div><dt>创建时间</dt><dd>${created}</dd></div>
        <div><dt>更新时间</dt><dd>${updated}</dd></div>
        <div><dt>等待时间</dt><dd>${fmtDur(data.wait_sec||0)}</dd></div>
        <div><dt>执行时长</dt><dd>${data.duration_sec != null ? fmtDur(data.duration_sec) : '--'}</dd></div>
        <div><dt>快照</dt><dd style="font-family:monospace;font-size:11px">${data.snapshot_id||'--'}</dd></div>
      </div>
      ${parents.length ? `<div style="margin-top:8px"><dt>依赖 (depends_on)</dt><dd class="dag-tree">${parents.join('\n')}</dd></div>` : ''}
      ${children.length ? `<div style="margin-top:4px"><dt>子任务 (children)</dt><dd class="dag-tree">${children.join('\n')}</dd></div>` : ''}
      ${data.error ? `<div class="error-block">⚠ ${esc(data.error)}</div>` : ''}
      <div class="detail-actions">
        ${data._has_trace ? `<button class="btn small" onclick="event.stopPropagation();viewTrace('${taskId}')">📄 查看 Trace</button>` : ''}
        <button class="btn small danger" onclick="event.stopPropagation();rollbackTask('${taskId}')">↩ 回滚</button>
      </div>
    `;
    detailRow.classList.add('open');
  }
}

// ═══════════════════════════════════════════════════════
// Submit Task
// ═══════════════════════════════════════════════════════
async function submitTask() {
  const desc = document.getElementById('new-task-desc').value.trim();
  if (!desc) return;
  const r = await api('/api/tasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({description: desc}),
  });
  if (r.ok) {
    document.getElementById('new-task-desc').value = '';
    refreshAll();
  } else {
    alert('创建失败: ' + (r.error || '未知错误'));
  }
}

// ═══════════════════════════════════════════════════════
// Rollback
// ═══════════════════════════════════════════════════════
async function rollbackTask(taskId) {
  if (!confirm(`确定回滚任务 ${taskId.slice(-8)}？`)) return;
  const r = await api('/api/tasks/' + taskId + '/rollback', {method:'POST'});
  if (r.ok) refreshAll();
  else alert('回滚失败: ' + (r.error || '未知错误'));
}

// ═══════════════════════════════════════════════════════
// Trace View
// ═══════════════════════════════════════════════════════
async function viewTrace(taskId) {
  const data = await api('/api/tasks/' + taskId + '/trace');
  const modal = document.getElementById('trace-modal');
  const content = document.getElementById('trace-content');
  if (data.error) {
    content.innerHTML = `<h2>Trace 不可用</h2><p>${esc(data.error)}</p><button class="btn" onclick="closeTrace()">关闭</button>`;
  } else {
    const summary = {
      final_status: data.final_status,
      route_level: data.route?.level,
      validation_verdict: data.validation?.verdict,
      changed_files: data.changed_files,
      elapsed: data.elapsed,
      token_count: data.token_count,
    };
    content.innerHTML = `
      <h2 style="margin-bottom:12px">📄 Trace: ${taskId.slice(-8)}</h2>
      <div style="font-size:13px">
        <p><b>最终状态:</b> ${data.final_status||'?'}</p>
        <p><b>路由级别:</b> ${data.route?.level||'?'}</p>
        <p><b>验证结论:</b> ${data.validation?.verdict||'?'}</p>
        <p><b>改动文件:</b> ${(data.changed_files||[]).join(', ')||'无'}</p>
        <p><b>耗时:</b> ${data.elapsed ? data.elapsed.toFixed(1)+'s' : '?'}</p>
        <p><b>Token:</b> ${data.token_count||0}</p>
      </div>
      <details style="margin-top:8px">
        <summary>完整 JSON</summary>
        <pre>${esc(JSON.stringify(data, null, 2))}</pre>
      </details>
      <button class="btn" onclick="closeTrace()">关闭</button>
    `;
  }
  modal.classList.add('open');
}

function closeTrace() {
  document.getElementById('trace-modal').classList.remove('open');
}

// ═══════════════════════════════════════════════════════
// Conflicts
// ═══════════════════════════════════════════════════════
function renderConflicts() {
  const sec = document.getElementById('conflict-section');
  const list = document.getElementById('conflict-list');
  if (!conflicts.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  list.innerHTML = conflicts.map(c => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <span style="font-family:monospace;font-size:11px">${c.id.slice(-8)}</span>
        <span style="margin-left:8px">${esc((c.description||'').slice(0,60))}</span>
        ${c.error ? `<div style="font-size:11px;color:var(--orange)">${esc(c.error.slice(0,120))}</div>` : ''}
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn small primary" onclick="resolveConflict('${c.id}','manual')">已解决</button>
        <button class="btn small danger" onclick="resolveConflict('${c.id}','abort')">放弃</button>
      </div>
    </div>
  `).join('');
}

async function resolveConflict(taskId, action) {
  const r = await api('/api/conflicts/' + taskId + '/resolve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action}),
  });
  if (r.ok) refreshAll();
  else alert('操作失败: ' + (r.error || '未知错误'));
}

// ═══════════════════════════════════════════════════════
// Memory Query
// ═══════════════════════════════════════════════════════
async function queryMemory() {
  const q = document.getElementById('mem-query').value.trim();
  const res = await api('/api/memory?q=' + encodeURIComponent(q));
  const stats = res.stats;
  document.getElementById('mem-stats').innerHTML = stats ?
    `事件:${stats.events} | 语义边:${stats.edges_semantic} | 时间边:${stats.edges_temporal} | 因果边:${stats.edges_causal_explicit}E+${stats.edges_causal_inferred}I | 实体边:${stats.edges_entity} | 候选:${stats.latent_candidates}` : '';

  if (res.error) {
    document.getElementById('mem-results').innerHTML = `<div class="error-block">${esc(res.error)}</div>`;
    return;
  }

  const trav = res.traversal;
  let html = '';

  // Stage 3-4: Traversal narrative
  if (trav && trav.narrative && trav.narrative.length) {
    html += `<div style="margin-bottom:12px"><b>🎯 ${trav.intent} 遍历</b> (${trav.total_results}结果, 图覆盖: ${JSON.stringify(trav.graph_coverage)})`;
    if (trav.budget_exceeded) html += ' <span style="color:var(--orange)">⚠超预算</span>';
    html += '</div>';
    trav.narrative.forEach(r => {
      const pathStr = r.path && r.path.length ? r.path.map(p=>`${p[0]}→${p[1]}`).join(' ') : '入口';
      const truncated = r.truncated ? '...' : '';
      html += `<div class="mem-card">
        <span class="sim">${r.score.toFixed(4)}</span>
        <span style="font-family:monospace;font-size:11px">${(r.task_id||'').slice(-8)}</span>
        <span style="color:var(--text2);font-size:10px">[${(r.graph_sources||[]).join(',')}]</span>
        ${esc((r.description||'').slice(0,60))}${truncated}
        <div class="source">${pathStr}</div>
      </div>`;
    });
  }

  // Semantic baseline (direct Jaccard)
  if (res.semantic_baseline && res.semantic_baseline.length) {
    html += '<div style="margin-bottom:12px"><b>📊 语义基线:</b>';
    res.semantic_baseline.forEach(t => {
      html += `<div class="mem-card"><span class="sim">${t.similarity.toFixed(3)}</span> <span style="font-family:monospace;font-size:11px">${(t.task_id||'').slice(-8)}</span> ${esc((t.description||'').slice(0,60))}</div>`;
    });
    html += '</div>';
  }

  // Entity matches
  if (res.entity_matches && Object.keys(res.entity_matches).length) {
    html += '<div style="margin-bottom:12px"><b>📁 实体重叠:</b>';
    Object.entries(res.entity_matches).forEach(([f,ids]) => {
      html += `<div class="mem-card">📁 ${esc(f)} ← ${ids.map(i=>(i||'').slice(-8)).join(', ')}</div>`;
    });
    html += '</div>';
  }

  document.getElementById('mem-results').innerHTML = html || '<span style="color:var(--text2)">无结果</span>';
}

// ═══════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtDur(sec) {
  if (sec < 60) return Math.round(sec) + 's';
  if (sec < 3600) return (sec/60).toFixed(1) + 'm';
  return (sec/3600).toFixed(2) + 'h';
}

function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleString('zh-CN') + ' | v3 MAGMA';
}

// ═══════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════
refreshAll();
queryMemory();
setInterval(refreshAll, 5000);
</script>
