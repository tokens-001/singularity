<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇点 Agent 调度平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>奇点</h1>
  <nav>
    <button class="tab active" data-tab="dashboard">仪表盘</button>
    <button class="tab" data-tab="tasks">任务</button>
    <button class="tab" data-tab="project">项目</button>
    <button class="tab" data-tab="config">配置</button>
  </nav>
  <div id="header-right">
    <span id="loop-badge" class="badge off">调度已停</span>
    <span id="budget-badge" class="badge">💰 --</span>
  </div>
</header>

<main>
  <!-- ═══ 仪表盘 ═══ -->
  <section id="tab-dashboard" class="tab-content active">
    <div class="cards" id="status-cards"></div>
    <div class="row">
      <button id="btn-loop-start" class="btn primary" onclick="toggleLoop()">▶ 启动调度</button>
      <button id="btn-loop-stop" class="btn danger" onclick="toggleLoop()" style="display:none">⏹ 停止</button>
      <button class="btn" onclick="cleanup()">🧹 清理残留</button>
    </div>
    <div class="panel" id="event-panel" style="display:none">
      <h3>调度事件</h3>
      <div id="event-feed"></div>
    </div>
  </section>

  <!-- ═══ 任务 ═══ -->
  <section id="tab-tasks" class="tab-content">
    <div class="row">
      <select id="filter-status" onchange="renderTasks()">
        <option value="">全部状态</option>
        <option value="pending">待处理</option>
        <option value="running">运行中</option>
        <option value="done">完成</option>
        <option value="failed">失败</option>
      </select>
      <input id="filter-search" placeholder="搜索任务..." oninput="renderTasks()">
      <span id="task-count" class="muted"></span>
    </div>
    <table id="task-table">
      <thead><tr><th>ID</th><th>描述</th><th>状态</th><th>层级</th><th>耗时</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- ═══ 项目 ═══ -->
  <section id="tab-project" class="tab-content">
    <div class="panel">
      <h3>创建项目</h3>
      <div class="form-grid">
        <input id="proj-name" placeholder="项目名称">
        <select id="proj-template">
          <option value="product_dev">产品开发</option>
          <option value="bug_fix">Bug 修复</option>
          <option value="refactor">重构优化</option>
          <option value="agent_dev">Agent 开发</option>
        </select>
        <input id="proj-budget" placeholder="预算 $" value="3.00" type="number" step="0.5">
      </div>
      <textarea id="proj-desc" placeholder="需求描述（必填）" rows="3"></textarea>
      <button class="btn primary" onclick="createProject()">创建项目</button>
    </div>

    <div class="panel">
      <h3>项目列表</h3>
      <div id="project-list"></div>
    </div>

    <div class="panel" id="project-detail" style="display:none">
      <div id="project-detail-content"></div>
    </div>
  </section>

  <!-- ═══ 配置 ═══ -->
  <section id="tab-config" class="tab-content">
    <div class="panel">
      <h3>Agent 编组 <span class="muted">（排序=优先级，拖拽调整后点保存）</span></h3>
      <div id="agent-tiers"></div>
    </div>
    <div class="panel">
      <h3>API 库</h3>
      <div id="api-store"></div>
    </div>
  </section>
</main>

<div id="toast-container"></div>

<script src="/static/app.js"></script>
</body>
</html>
