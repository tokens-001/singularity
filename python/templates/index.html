<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇点 Agent 调度平台</title>
<style>
/* ═══════════════════════════════════════════════════════
   奇点调度指挥中心 — Tactical Telemetry Terminal
   设计原型: CRT 暗色终端 / 战术遥测面板
   规则:
     - 零圆角  零阴影  零渐变
     - gap:1px 隔间代替传统边框
     - 等宽=数据  无衬线=标题
     - 悬停=变暗 (终端逻辑)
     - 单 accent 色系 (cyan=执行 purple=架构 orange=建造)
   ═══════════════════════════════════════════════════════ */
:root {
  --bg:       #0a0a0c;
  --bg2:      #0e1014;
  --bg3:      #13161c;
  --grid:     #1a1d24;
  --grid-hi:  #242833;
  --text:     #c4c9d4;
  --text2:    #555b6b;
  --text3:    #353b48;
  --cyan:     #39d2c0;
  --purple:   #a371f7;
  --orange:   #d2991d;
  --red:      #f44747;
  --green:    #4ec97a;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace;
  --scanline: rgba(255,255,255,.012);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--purple); color: #fff; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--grid-hi); }

body {
  font-family: var(--font);
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.4;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  /* CRT scanlines */
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scanline) 2px, var(--scanline) 4px);
}

/* ═══ Top Bar ═══ */
.topbar {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 8px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--grid);
  position: sticky; top: 0; z-index: 50;
}
.topbar h1 { font-size: 13px; font-weight: 600; letter-spacing: .02em; font-family: var(--mono); }
.topbar h1 span { color: var(--purple); }
.topbar .live { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.topbar .live.on { color: var(--green); }

/* ═══ Tab Bar ═══ */
.tab-bar {
  display: flex; gap: 1px; padding: 0 16px;
  background: var(--bg2); border-bottom: 1px solid var(--grid);
  position: sticky; top: 33px; z-index: 49;
}
.tab {
  padding: 6px 14px; font-size: 10px; font-weight: 500;
  color: var(--text3); cursor: pointer;
  background: transparent;
  font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase;
  transition: color .1s, background .1s;
}
.tab:hover { color: var(--text2); background: var(--bg3); }
.tab.active { color: var(--cyan); background: var(--bg3); border-bottom: 1px solid var(--cyan); }

/* ═══ Content ═══ */
.tab-content { display: none; padding: 12px 16px; }
.tab-content.active { display: block; }

/* ═══ Status Cards ═══ */
.cards { display: flex; gap: 1px; flex-wrap: wrap; margin-bottom: 12px; }
.card {
  background: var(--bg2); padding: 10px 14px; min-width: 90px; flex: 1;
  transition: background .15s;
}
.card:hover { background: var(--bg3); }
.card .count { font-size: 26px; font-weight: 400; font-family: var(--mono); line-height: 1; }
.card .label { font-size: 8px; color: var(--text3); margin-top: 6px; text-transform: uppercase; letter-spacing: .1em; font-family: var(--mono); }
.card.pending  .count { color: var(--text3); }
.card.running  .count { color: var(--cyan); }
.card.done     .count { color: var(--green); }
.card.failed   .count { color: var(--red); }
.card.conflict .count { color: var(--orange); }
.card.held     .count { color: var(--purple); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.pulse { animation: pulse 2s step-end infinite; }

/* ═══ Section ═══ */
.section {
  background: var(--bg2);
  margin-bottom: 8px;
  /* gap:1px 技巧: 子元素的 border 用背景色间隙代替 */
}
.section-title {
  font-size: 9px; font-weight: 500; padding: 6px 12px;
  background: var(--bg3);
  display: flex; justify-content: space-between; align-items: center;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text2);
  font-family: var(--mono);
  border-bottom: 1px solid var(--grid);
}
.section-body { padding: 10px 12px; }

/* ═══ Table ═══ */
table { width: 100%; border-collapse: collapse; font-size: 10px; }
thead { border-bottom: 1px solid var(--grid); }
th { text-align: left; padding: 5px 8px; background: var(--bg3); color: var(--text2);
     font-weight: 400; font-size: 8px; text-transform: uppercase; letter-spacing: .08em; font-family: var(--mono); }
td { padding: 4px 8px; }
tr { border-bottom: 1px solid var(--bg3); }
tr:hover td { background: rgba(255,255,255,.015); }
tr.expanded td { background: rgba(161,120,240,.04); }

/* ═══ Badges ═══ */
.badge {
  display: inline-block; padding: 1px 5px;
  font-size: 8px; font-weight: 500; letter-spacing: .04em;
  font-family: var(--mono); text-transform: uppercase;
}
.badge.pending   { color: var(--text3); }
.badge.routed    { color: var(--text2); }
.badge.dispatched{ color: var(--purple); }
.badge.running   { color: var(--cyan); }
.badge.validating{ color: var(--purple); }
.badge.done      { color: var(--green); }
.badge.failed    { color: var(--red); }
.badge.rolled_back{ color: var(--red); opacity: .6; }
.badge.decomposed{ color: var(--orange); }
.badge.blocked   { color: var(--text3); }
.badge.conflict_held{ color: var(--orange); }

.level-tag {
  display: inline-block; padding: 0 4px;
  font-size: 7px; font-weight: 600; letter-spacing: .06em; margin-left: 4px;
  font-family: var(--mono); text-transform: uppercase;
}
.level-e  { color: var(--cyan); }
.level-d  { color: var(--purple); }
.level-ep { color: var(--orange); }

/* ═══ Buttons ═══ */
.btn {
  padding: 3px 9px; border: none;
  background: var(--bg3); color: var(--text2); cursor: pointer;
  font-size: 9px; font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase;
  transition: background .1s, color .1s;
}
.btn:hover { background: var(--grid-hi); color: var(--text); }
.btn.cyan   { color: var(--cyan); }
.btn.cyan:hover   { background: rgba(57,210,192,.08); color: var(--cyan); }
.btn.purple { color: var(--purple); }
.btn.purple:hover { background: rgba(163,113,247,.08); color: var(--purple); }
.btn.orange { color: var(--orange); }
.btn.orange:hover { background: rgba(210,153,29,.08); color: var(--orange); }
.btn.red    { color: var(--red); }
.btn.red:hover    { background: rgba(244,71,71,.08); color: var(--red); }
.btn.sm { padding: 2px 6px; font-size: 8px; }

/* ═══ Form ═══ */
.form-row { display: flex; gap: 6px; }
textarea, input, select {
  background: var(--bg); border: none; border-bottom: 1px solid var(--grid);
  padding: 5px 6px; color: var(--text); font-family: var(--mono); font-size: 10px; width: 100%;
  transition: border-color .1s;
}
textarea:focus, input:focus, select:focus { outline: none; border-bottom-color: var(--purple); }
textarea { resize: vertical; min-height: 40px; }
.filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.filter-bar select { width: auto; }

/* ═══ Agent Row ═══ */
.agent-row { display: flex; gap: 16px; align-items: center; font-size: 10px; font-family: var(--mono); }
.agent-dot { width: 6px; height: 6px; display: inline-block; margin-right: 5px; }
.e-dot  { background: var(--cyan); }
.d-dot  { background: var(--purple); }
.ep-dot { background: var(--orange); }

/* ═══ SVG Flow ═══ */
.flow-svg { width: 100%; height: auto; display: block; }
.flow-node { cursor: pointer; }
.flow-node:hover { opacity: .7; }
.flow-node text { fill: var(--text); font-family: var(--mono); font-size: 9px; text-anchor: middle; }
.flow-label { font-size: 8px; fill: var(--text3); text-anchor: middle; }

/* ═══ Phase Pipeline ═══ */
.phase-step { flex:1; text-align:center; padding:2px 0; background:var(--bg3); font-size:8px;
  font-family:var(--mono); text-transform:uppercase; overflow:hidden; white-space:nowrap; }
.phase-step.done    { color:var(--green); }
.phase-step.current { color:var(--purple); font-weight:500; }
.phase-step.future  { color:var(--text3); }

/* ═══ Timeline ═══ */
.timeline { position: relative; padding-left: 12px; border-left: 1px solid var(--grid); }
.tl-node { position: relative; padding: 1px 0 10px 12px; }
.tl-node::before { content: ''; position: absolute; left: -15px; top: 3px;
  width: 5px; height: 5px; background: var(--grid); }
.tl-node.active::before { background: var(--cyan); }
.tl-node.done::before   { background: var(--green); }
.tl-node.failed::before { background: var(--red); }
.tl-node .tl-from { font-size: 8px; color: var(--text3); font-family: var(--mono); }
.tl-node .tl-to   { font-size: 10px; font-weight: 500; margin-left: 4px; }
.tl-node .tl-meta { font-size: 8px; color: var(--text3); margin-top: 2px; display: block; font-family: var(--mono); }

/* ═══ Decision Cards ═══ */
.decision-card { margin-bottom: 8px; }
.decision-card .dc-header {
  padding: 5px 10px; font-size: 9px; font-weight: 500; letter-spacing: .04em;
  background: var(--bg3); font-family: var(--mono); text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--grid);
}
.dc-header.route      { color: var(--purple); border-left: 2px solid var(--purple); }
.dc-header.presearch  { color: var(--cyan); border-left: 2px solid var(--cyan); }
.dc-header.validation { color: var(--green); border-left: 2px solid var(--green); }
.decision-card .dc-body { padding: 6px 10px; font-size: 9px; }
.dc-body .signal-row { display: flex; align-items: flex-start; gap: 4px; margin-bottom: 1px; }
.signal-row .sig-icon { font-size: 8px; flex-shrink: 0; }
.dc-body .kb-hit { padding: 1px 0; font-family: var(--mono); font-size: 8px; }
.dc-body .magma-hit { padding: 1px 0; border-bottom: 1px solid var(--bg3); font-size: 8px; }
pre.agent-out {
  background: var(--bg); padding: 6px 8px; font-size: 8px; max-height: 180px; overflow-y: auto;
  white-space: pre-wrap; font-family: var(--mono); color: var(--text2);
}

/* ═══ Detail Panel ═══ */
.detail { display: none; }
.detail.open { display: table-row; }
.detail td { padding: 12px 16px; background: rgba(0,0,0,.2); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; font-size: 10px; }
.detail-grid dt { color: var(--text3); font-size: 8px; font-family: var(--mono); text-transform: uppercase; }
.detail-grid dd { margin-bottom: 3px; word-break: break-all; }
.detail-actions { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.error-block { background: rgba(244,71,71,.06); padding: 5px 7px; margin-top: 3px; font-size: 9px; max-height: 70px; overflow-y: auto; }
.dag-tree { font-family: var(--mono); font-size: 9px; white-space: pre; color: var(--text3); }

/* ═══ Loop Control ═══ */
.loop-bar {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: var(--bg2); margin-bottom: 10px; border-bottom: 1px solid var(--grid);
}
.loop-indicator { width: 5px; height: 5px; }
.loop-indicator.off { background: var(--text3); }
.loop-indicator.on  { background: var(--green); animation: pulse 2s step-end infinite; }
.loop-status { font-size: 9px; font-weight: 500; font-family: var(--mono); text-transform: uppercase; }
.loop-status.off { color: var(--text3); }
.loop-status.on  { color: var(--green); }
.event-feed { max-height: 140px; overflow-y: auto; font-size: 8px; font-family: var(--mono); }
.event-row { padding: 1px 0; border-bottom: 1px solid var(--bg3); display: flex; gap: 6px; }
.event-row .ev-ts     { color: var(--text3); flex-shrink: 0; }
.event-row .ev-task   { color: var(--cyan); }
.event-row .ev-system { color: var(--purple); }
.event-row .ev-error  { color: var(--red); }
.event-row .ev-idle   { color: var(--text3); }

/* ═══ Intervention ═══ */
.check-col { width: 2em; }
.intervention-row { display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0; border-bottom: 1px solid var(--bg3); font-size: 10px; }
.intervention-row:last-child { border-bottom: none; }
.held-tag { font-size: 7px; color: var(--purple); margin-left: 4px; font-family: var(--mono); text-transform: uppercase; }

/* ═══ Trace Modal ═══ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.85); z-index: 100; overflow-y: auto;
}
.modal-overlay.open { display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; }
.modal-box { background: var(--bg2); padding: 14px; max-width: 680px; width: 100%; border: 1px solid var(--grid); }
.modal-box pre { white-space: pre-wrap; font-size: 9px; max-height: 400px; overflow-y: auto; font-family: var(--mono); }

/* ═══ Layout helpers ═══ */
.gap-1 { display: flex; gap: 1px; flex-wrap: wrap; }
.gap-1 > * { flex: 1; }

@media (max-width: 768px) {
  .cards { flex-direction: column; }
  .detail-grid { grid-template-columns: 1fr; }
  .tab-bar { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     Top Bar
     ═══════════════════════════════════════════════════════ -->
<div class="topbar">
  <h1><span>奇点</span> / 调度指挥中心</h1>
  <div class="live on" id="live-indicator">SYS.ONLINE</div>
</div>

<!-- ═══════════════════════════════════════════════════════
     Tab Bar
     ═══════════════════════════════════════════════════════ -->
<div class="tab-bar" id="tab-bar">
  <div class="tab active" data-tab="dashboard">仪表盘</div>
  <div class="tab" data-tab="tasks">任务</div>
  <div class="tab" data-tab="project">项目</div>
  <div class="tab" data-tab="config">配置</div>
</div>

<!-- ═══════════════════════════════════════════════════════
     Tab 1: 仪表盘 — 一眼看完的系统状态
     ═══════════════════════════════════════════════════════ -->
<div class="tab-content active" id="tab-dashboard">

  <div class="cards" id="status-cards"></div>

  <div class="loop-bar">
    <span class="loop-indicator off" id="loop-dot"></span>
    <span class="loop-status off" id="loop-label">调度循环 · 未启动</span>
    <span style="font-size:9px;color:var(--text3);font-family:var(--mono)" id="loop-info"></span>
    <span style="flex:1"></span>
    <button class="btn cyan sm" id="btn-loop-start" onclick="startLoop()">启动</button>
    <button class="btn red sm" id="btn-loop-stop" onclick="stopLoop()" style="display:none">停止</button>
  </div>

  <div style="display:flex;gap:1px;flex-wrap:wrap;margin-bottom:8px">
    <div class="section" style="flex:1;min-width:240px">
      <div class="section-title">实时事件</div>
      <div class="section-body event-feed" id="event-feed" style="min-height:60px;max-height:200px;overflow-y:auto">
        <span style="color:var(--text3);font-family:var(--mono);font-size:9px">等待调度循环启动...</span>
      </div>
    </div>
    <div class="section" style="flex:1;min-width:200px">
      <div class="section-title">奏报</div>
      <div class="section-body" id="reports-body" style="font-size:9px;max-height:200px;overflow-y:auto;font-family:var(--mono)"></div>
    </div>
  </div>

  <div style="display:flex;gap:1px;flex-wrap:wrap;margin-bottom:8px">
    <div class="section" style="flex:1;min-width:200px">
      <div class="section-title">扣留待处理</div>
      <div class="section-body" id="held-list" style="font-size:10px"><span style="color:var(--text3)">无</span></div>
    </div>
    <div class="section" style="flex:1;min-width:200px">
      <div class="section-title">失败可重试</div>
      <div class="section-body" id="failed-list" style="font-size:10px"><span style="color:var(--text3)">无</span></div>
    </div>
  </div>

  <div class="agent-row" id="agent-row"></div>
  <div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:4px" id="token-stats"></div>

</div>

<!-- ═══════════════════════════════════════════════════════
     Tab 2: 任务 — 提交 / 查看 / 操作
     ═══════════════════════════════════════════════════════ -->
<div class="tab-content" id="tab-tasks">

  <div class="section">
    <div class="section-title">新建任务</div>
    <div class="section-body">
      <div class="form-row">
        <textarea id="new-task-desc" placeholder="描述任务，回车提交..."
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitTask()}"></textarea>
        <button class="btn purple" onclick="submitTask()" style="flex-shrink:0">提交</button>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <select id="filter-status" onchange="renderTasks()">
      <option value="">全部状态</option>
      <option value="pending">pending</option>
      <option value="routed">routed</option>
      <option value="dispatched">dispatched</option>
      <option value="running">running</option>
      <option value="done">done</option>
      <option value="failed">failed</option>
    </select>
    <select id="filter-level" onchange="renderTasks()">
      <option value="">全部层级</option>
      <option value="E">E</option>
      <option value="E+">E+</option>
      <option value="D">D</option>
    </select>
    <span style="flex:1"></span>
    <span style="font-size:9px;color:var(--text3);font-family:var(--mono)" id="task-count"></span>
  </div>

  <div class="section" style="overflow-x:auto">
    <table><tbody id="task-table"></tbody></table>
  </div>

  <div class="section" style="margin-top:8px" id="flow-section">
    <div class="section-title" onclick="document.getElementById('flow-body').style.display=document.getElementById('flow-body').style.display==='none'?'block':'none'" style="cursor:pointer">
      任务流图 <span style="font-size:9px;color:var(--text3);font-weight:normal;text-transform:none">点击折叠</span>
    </div>
    <div class="section-body" id="flow-body" style="padding:0"></div>
  </div>

</div>

<!-- ═══════════════════════════════════════════════════════
     Tab 3: 项目 — 工作流管理
     ═══════════════════════════════════════════════════════ -->
<div class="tab-content" id="tab-project">

  <div class="section">
    <div class="section-title">创建项目</div>
    <div class="section-body">
      <div class="form-row">
        <input id="new-project-name" placeholder="项目名称" style="flex:1">
        <select id="new-project-template" style="width:auto">
          <option value="product_dev">产品开发</option>
          <option value="bug_fix">Bug修复</option>
          <option value="refactor">重构优化</option>
        </select>
        <input id="new-project-desc" placeholder="需求描述（可选）" style="flex:2">
        <button class="btn purple" onclick="createProject()">创建</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">项目列表</div>
    <div class="section-body" id="project-list" style="font-size:10px"></div>
  </div>

  <div class="section" id="project-detail" style="display:none">
    <div class="section-title" id="project-detail-title"></div>
    <div class="section-body" id="project-detail-body" style="font-size:10px"></div>
  </div>

</div>

<!-- ═══════════════════════════════════════════════════════
     Tab 4: 配置 — API库 / 模型库 / Agent编组 / 干预
     ═══════════════════════════════════════════════════════ -->
<div class="tab-content" id="tab-config">

  <div style="display:flex;gap:1px;flex-wrap:wrap;margin-bottom:8px">
    <div class="section" style="flex:1;min-width:300px">
      <div class="section-title">API 库 <button class="btn cyan sm" style="margin-left:8px" onclick="renderAPIStore()">刷新</button></div>
      <div class="section-body" id="api-store-body" style="font-size:10px;max-height:250px;overflow-y:auto"></div>
      <div style="padding:6px 10px;border-top:1px solid var(--grid);display:flex;gap:4px;flex-wrap:wrap">
        <input id="api-new-id" placeholder="id" style="width:70px;font-size:9px">
        <input id="api-new-provider" placeholder="提供商" style="width:70px;font-size:9px">
        <input id="api-new-url" placeholder="base_url" style="width:130px;font-size:9px">
        <input id="api-new-env" placeholder="环境变量" style="width:90px;font-size:9px">
        <button class="btn cyan sm" onclick="addAPI()">添加</button>
      </div>
    </div>
    <div class="section" style="flex:1;min-width:300px">
      <div class="section-title">模型库 <button class="btn cyan sm" style="margin-left:8px" onclick="renderModels()">刷新</button></div>
      <div class="section-body" id="models-body" style="font-size:10px;max-height:200px;overflow-y:auto"></div>
      <div style="padding:4px 10px;border-top:1px solid var(--grid);display:flex;gap:4px;flex-wrap:wrap;align-items:center">
        <input id="model-new-id" placeholder="id" style="width:90px;font-size:9px">
        <input id="model-new-provider" placeholder="provider" style="width:70px;font-size:9px">
        <input id="model-new-display" placeholder="显示名" style="width:80px;font-size:9px">
        <select id="model-new-tier" style="width:55px;font-size:9px;padding:2px">
          <option value="E">E</option>
          <option value="E+">E+</option>
          <option value="D">D</option>
        </select>
        <select id="model-new-speed" style="width:55px;font-size:9px;padding:2px">
          <option value="fast">快</option>
          <option value="medium" selected>中</option>
          <option value="slow">慢</option>
        </select>
        <select id="model-new-cost" style="width:55px;font-size:9px;padding:2px">
          <option value="budget">低</option>
          <option value="standard" selected>标</option>
          <option value="premium">高</option>
        </select>
        <label style="font-size:9px;color:var(--text3);font-family:var(--mono);display:flex;align-items:center;gap:2px"><input type="checkbox" id="model-new-reasoning">推理</label>

  <div class="section" style="margin-bottom:8px">
    <div class="section-title">架构切换 <button class="btn cyan sm" style="margin-left:8px" onclick="renderLayerSwitch()">刷新</button></div>
    <div class="section-body" id="layer-switch-body" style="font-size:10px"></div>
  </div>

</div>

<!-- ═══════════════════════════════════════════════════════
     Trace Modal
     ═══════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="trace-modal" onclick="if(event.target===this)closeTrace()">
  <div class="modal-box" id="trace-content"></div>
</div>

<script>

async function startProject(id){ const r=await api('/api/projects/'+id+'/start',{method:'POST'}); if(r.ok||r.output) loadProject(id); else alert(r.error||'失败'); }
async function runPhase(id){ const r=await api('/api/projects/'+id+'/run-phase',{method:'POST'}); if(r.ok||r.output) loadProject(id); else alert(r.error||'失败'); }
async function createProject(){
  const name=document.getElementById('new-project-name').value.trim();
  if(!name) return alert('需要项目名称');
  const r=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    name,template:document.getElementById('new-project-template').value,
    description:document.getElementById('new-project-desc').value.trim()
  })});
  if(r.ok){ document.getElementById('new-project-name').value=''; document.getElementById('new-project-desc').value=''; loadProjects(); loadProject(r.project.id); }
  else alert(r.error||'创建失败');
}

// ═══════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════
let tasks=[], statusData={}, conflicts=[], expandedTask=null, activeTab='dashboard', flowClickFilter='';
let _lastTasksHash='', _lastFlowHash='';  // 避免无脑重绘

const STATUS_CN = {
  pending:'待处理',routed:'已路由',dispatched:'已分发',running:'运行中',
  validating:'验证中',done:'完成',failed:'失败',rolled_back:'已回滚',
  decomposed:'已分解',blocked:'阻塞',conflict_held:'冲突'
};

// ═══════════════════════════════════════════════════════
// Tab Switching
// ═══════════════════════════════════════════════════════
document.getElementById('tab-bar').addEventListener('click',e=>{
  if(!e.target.classList.contains('tab'))return;
  activeTab = e.target.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+activeTab).classList.add('active');
  if(activeTab==='tasks') renderTasks();
  if(activeTab==='project') loadProjects();
  if(activeTab==='config'){ renderAPIStore(); renderModels(); renderLayerSwitch(); renderIntervention(); }
});

// ═══════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════
async function api(path,opts){
  try{const r=await fetch(path,opts);return await r.json();}
  catch(e){return{error:e.message}};
}

// ═══════════════════════════════════════════════════════
// Refresh
// ═══════════════════════════════════════════════════════
async function refreshAll(){
  const ind=document.getElementById('live-indicator');
  ind.className='live'; ind.textContent='◆';

  const [s,t,c,r]=await Promise.all([
    api('/api/status'),api('/api/tasks'),api('/api/conflicts'),api('/api/reports/critical')
  ]);
  if(r&&r.length){renderReports(r);}
  statusData=s; conflicts=c.conflicts||[];
  const newTasks=t.tasks||[];

  // 数据没变就跳过 DOM 重绘
  const tasksHash=JSON.stringify(newTasks);
  const flowHash=JSON.stringify(s.counts||{});
  const tasksChanged=tasksHash!==_lastTasksHash;
  const flowChanged=flowHash!==_lastFlowHash;

  tasks=newTasks; _lastTasksHash=tasksHash;
  renderStatusCards(); renderAgentRow(); renderTokenStats();

  if(tasksChanged){ renderTasks(); renderConflicts(); }
  renderIntervention(); // dashboard always shows held/failed
  if(activeTab==='tasks'){ renderTasks(); if(flowChanged){ _lastFlowHash=flowHash; renderFlowDiagram(); } }

  ind.className='live on'; ind.textContent='●';
}

// ═══════════════════════════════════════════════════════
// Status Cards
// ═══════════════════════════════════════════════════════
function renderStatusCards(){
  const counts=statusData.counts||{};
  const heldCount=tasks.filter(t=>t.held).length;
  const cards=[
    {k:'pending',label:'待处理',cls:'pending'},
    {k:'running',label:'运行中',cls:'running',n:statusData.running_total||0},
    {k:'done',label:'已完成',cls:'done'},
    {k:'failed',label:'失败',cls:'failed'},
    {k:'conflict_held',label:'冲突',cls:'conflict'},
    {k:'held',label:'扣留',cls:'held',n:heldCount},
  ];
  document.getElementById('status-cards').innerHTML=cards.map(c=>{
    const n=c.n!==undefined?c.n:(counts[c.k]||0);
    return `<div class="card ${c.cls}"><div class="count${c.k==='running'?' pulse':''}">${n}</div><div class="label">${c.label}</div></div>`;
  }).join('');

  // Populate filter dropdown
  const sel=document.getElementById('f-status');
  if(sel.options.length<=1){
    [...new Set(tasks.map(t=>t.status))].sort().forEach(s=>{
      if(!sel.querySelector(`[value="${s}"]`)){
        const o=document.createElement('option');o.value=s;o.textContent=STATUS_CN[s]||s;sel.appendChild(o);
      }
    });
  }
}

// ═══════════════════════════════════════════════════════
// Agent Row
// ═══════════════════════════════════════════════════════
function renderAgentRow(){
  const agents=statusData.agents||{};
  const loads=statusData.heartbeat_levels||{};
  document.getElementById('agent-row').innerHTML=['E','D','E+'].map(l=>{
    const n=loads[l]||0; const model=agents[l]&&agents[l][0]?agents[l][0].model:'';
    const c=l==='E'?'e-dot':l==='D'?'d-dot':'ep-dot';
    return `<span><span class="agent-dot ${c}"></span>${l} ${model} <b>${n}</b></span>`;
  }).join('');
  document.getElementById('timing-line').textContent=
    `等待 ${statusData.avg_wait||'--'} · 完成 ${statusData.avg_done||'--'}`+
    (statusData.stalled&&statusData.stalled.length?` · ⚠ ${statusData.stalled.length} 卡住`:'');
}

function renderTokenStats(){
  const tt=statusData.token_totals;
  if(!tt||!Object.keys(tt).length){document.getElementById('token-section').style.display='none';return;}
  document.getElementById('token-section').style.display='';
  const total=Object.values(tt).reduce((a,b)=>a+b,0);
  document.getElementById('token-body').innerHTML=`<b>合计</b> ${fmtTokens(total)} · `+
    Object.entries(tt).map(([l,t])=>`${l}: ${fmtTokens(t)}`).join(' · ');
}
function fmtTokens(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return String(n);}

// ═══════════════════════════════════════════════════════
// Flow Diagram — SVG 状态机
// ═══════════════════════════════════════════════════════
function renderFlowDiagram(){
  const counts=statusData.counts||{};
  const nodes=[
    {id:'pending',label:'PENDING',x:20,y:55},
    {id:'routed',label:'ROUTED',x:170,y:55},
    {id:'dispatched',label:'DISPATCHED',x:320,y:55},
    {id:'running',label:'RUNNING',x:470,y:25},
    {id:'done',label:'DONE',x:640,y:25},
    {id:'failed',label:'FAILED',x:640,y:85},
    {id:'conflict_held',label:'CONFLICT',x:790,y:85},
    {id:'decomposed',label:'DECOMPOSED',x:790,y:25},
  ];
  const colors={
    pending:'#6b7280',routed:'#4a8cf7',dispatched:'#a371f7',
    running:'#39d2c0',done:'#4ec97a',failed:'#f44747',
    conflict_held:'#d2991d',decomposed:'#d2991d',
  };

  let svg=`<svg class="flow-svg" viewBox="0 0 950 120">`;
  // Arrows
  const arrows=[
    ['pending','routed'],['routed','dispatched'],['dispatched','running'],
    ['running','done'],['running','failed'],['running','decomposed'],['running','conflict_held'],
  ];
  arrows.forEach(([a,b])=>{
    const na=nodes.find(n=>n.id===a), nb=nodes.find(n=>n.id===b);
    const x1=na.x+72,x2=nb.x,y1=na.y+12,y2=nb.y+12;
    svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#252a35" stroke-width="1.5"/>`;
    // arrowhead
    const ang=Math.atan2(y2-y1,x2-x1);
    svg+=`<polygon points="${x2-4},${y2-2.5} ${x2},${y2} ${x2-4},${y2+2.5}"
     transform="rotate(${ang*180/Math.PI},${x2},${y2})" fill="#252a35"/>`;
  });

  // Nodes
  nodes.forEach(n=>{
    const c=colors[n.id]||'#6b7280';
    const cnt=counts[n.id]||0;
    const highlight=flowClickFilter===n.id?'stroke-width="2" stroke="'+c+'"':'';
    svg+=`<g class="flow-node" onclick="flowClick('${n.id}')" ${highlight}>
      <rect x="${n.x}" y="${n.y}" width="72" height="24" rx="4" fill="rgba(19,23,31,.9)" stroke="${cnt>0?c:'#252a35'}"/>
      <text x="${n.x+36}" y="${n.y+14}" fill="${cnt>0?c:'#6b7280'}" font-size="9">${n.label}</text>
      <text x="${n.x+36}" y="${n.y+44}" class="count" fill="${cnt>0?c:'#252a35'}">${cnt}</text>
    </g>`;
  });
  svg+=`</svg>`;
  document.getElementById('flow-diagram').innerHTML=svg;
}

function flowClick(nodeId){
  flowClickFilter=flowClickFilter===nodeId?'':nodeId;
  document.getElementById('f-status').value=flowClickFilter;
  renderFlowDiagram();
  renderTasks();
}

// ═══════════════════════════════════════════════════════
// Task Table
// ═══════════════════════════════════════════════════════
function renderTasks(){
  const fs=document.getElementById('f-status').value;
  const fl=document.getElementById('f-level').value;
  const fh=document.getElementById('f-held').checked;

  let filtered=tasks;
  if(fs) filtered=filtered.filter(t=>t.status===fs);
  if(fl) filtered=filtered.filter(t=>t.route_level===fl);
  if(fh) filtered=filtered.filter(t=>t.held);

  document.getElementById('task-count').textContent=`${filtered.length} 条`;

  const tbody=document.getElementById('task-tbody');
  tbody.innerHTML=filtered.map(t=>{
    const idShort=(t.id||'').slice(-8);
    const desc=(t.description||'').slice(0,70);
    const status=STATUS_CN[t.status]||t.status||'?';
    const wait=fmtDur(t.wait_sec||0);
    const lvl=t.route_level||'';
    const lvls=lvl==='E'?'level-e':lvl==='D'?'level-d':lvl==='E+'?'level-ep':'';
    const heldMark=t.held?' ◈':'';
    return `<tr onclick="toggleDetail('${t.id}')" id="row-${t.id}">
      <td style="font-family:'SF Mono',monospace;font-size:10px;color:var(--text2)">${idShort}${heldMark}</td>
      <td>${esc(desc)}</td>
      <td><span class="badge ${t.status}">${status}</span></td>
      <td>${lvl?`<span class="level-tag ${lvls}">${lvl}</span>`:'--'}</td>
      <td style="font-size:11px;color:var(--text2)">${t.priority||0}</td>
      <td style="font-size:10px;color:var(--text2)">${wait}</td>
    </tr><tr class="detail" id="detail-${t.id}"><td colspan="6"></td></tr>`;
  }).join('')||`<tr><td colspan="6" style="color:var(--text2);text-align:center;padding:24px">-- 暂无任务 --</td></tr>`;
}

async function toggleDetail(taskId){
  const detailRow=document.getElementById('detail-'+taskId);
  const row=document.getElementById('row-'+taskId);
  if(detailRow.classList.contains('open')){
    detailRow.classList.remove('open');row.classList.remove('expanded');expandedTask=null;return;
  }
  if(expandedTask){
    const prev=document.getElementById('detail-'+expandedTask);
    if(prev)prev.classList.remove('open');
    const pr=document.getElementById('row-'+expandedTask);
    if(pr)pr.classList.remove('expanded');
  }
  expandedTask=taskId;row.classList.add('expanded');

  const [data,tl]=await Promise.all([
    api('/api/tasks/'+taskId),api('/api/tasks/'+taskId+'/timeline')
  ]);
  if(data.error){detailRow.querySelector('td').innerHTML=`<div class="error-block">${esc(data.error)}</div>`;detailRow.classList.add('open');return;}

  const parents=(data._dag_parents||[]).map(p=>`  ↳ ${(p.id||'').slice(-8)} ${esc((p.description||'').slice(0,30))} [${STATUS_CN[p.status]||p.status}]`);
  const children=(data._dag_children||[]).map(c=>`  ↳ ${(c.id||'').slice(-8)} ${esc((c.description||'').slice(0,30))} [${STATUS_CN[c.status]||c.status}]`);
  const created=unix2str(data.created_at); const updated=unix2str(data.updated_at);

  // Mini timeline
  let tlHtml='';
  if(tl.timeline){
    tl.timeline.forEach(node=>{
      const cls=node.to==='done'?'done':node.to==='failed'||node.to==='rolled_back'?'failed':node.to==='running'?'active':'';
      tlHtml+=`<div class="tl-node ${cls}">
        <span class="tl-from">${node.from||'∅'}</span>→<span class="tl-to">${node.to}</span>
        ${node.meta&&node.meta.route_level?`<span class="tl-meta">level=${node.meta.route_level}</span>`:''}
        ${node.meta&&node.meta.error?`<span class="tl-meta" style="color:var(--red)">${esc(node.meta.error.slice(0,80))}</span>`:''}
      </div>`;
    });
  }

  // Action buttons
  let actions='';
  const st=data.status;
  if(st==='pending'||st==='routed'||st==='blocked'){
    actions+=data.held
      ?`<button class="btn cyan sm" onclick="event.stopPropagation();releaseTask('${taskId}')">释放</button>`
      :`<button class="btn purple sm" onclick="event.stopPropagation();holdTask('${taskId}')">扣留</button>`;
    actions+=`<button class="btn orange sm" onclick="event.stopPropagation();overrideRoute('${taskId}')">覆盖路由</button>`;
  }
  if(st==='running'||st==='dispatched'){
    actions+=`<button class="btn red sm" onclick="event.stopPropagation();cancelTask('${taskId}')">取消</button>`;
  }
  if(st==='failed'||st==='rolled_back'){
    actions+=`<button class="btn cyan sm" onclick="event.stopPropagation();retryTask('${taskId}')">重试</button>`;
  }
  if(data._has_trace){
    actions+=`<button class="btn sm" onclick="event.stopPropagation();viewTrace('${taskId}')">Trace</button>`;
  }
  actions+=`<button class="btn red sm" onclick="event.stopPropagation();rollbackTask('${taskId}')">回滚</button>`;

  detailRow.querySelector('td').innerHTML=`
    <div class="detail-grid">
      <div><dt>ID</dt><dd style="font-family:'SF Mono',monospace;font-size:11px">${data.id||taskId}</dd></div>
      <div><dt>状态</dt><dd><span class="badge ${st}">${STATUS_CN[st]||st}</span>
        ${data.held?'<span class="held-tag">扣留</span>':''}
        ${data.route_locked?'<span style="font-size:9px;color:var(--orange);margin-left:4px">🔒锁定</span>':''}
      </dd></div>
      <div><dt>描述</dt><dd>${esc(data.description||'')}</dd></div>
      <div><dt>路由级别 · 类型</dt><dd>${data.route_level||'--'} · ${data.route_type||'--'}</dd></div>
      <div><dt>优先级 · 深度</dt><dd>${data.priority||0} · ${data.depth||0}</dd></div>
      <div><dt>重试</dt><dd>${data.retry_count||0}/${data.max_retries||3}</dd></div>
      <div><dt>创建</dt><dd>${created}</dd></div>
      <div><dt>更新</dt><dd>${updated}</dd></div>
      <div><dt>等待 · 耗时</dt><dd>${fmtDur(data.wait_sec||0)} · ${data.duration_sec!=null?fmtDur(data.duration_sec):'--'}</dd></div>
      <div><dt>快照</dt><dd style="font-family:'SF Mono',monospace;font-size:10px">${data.snapshot_id||'--'}</dd></div>
    </div>
    ${tlHtml?`<div style="margin-top:8px"><dt>流转</dt><div class="timeline" style="margin-top:4px">${tlHtml}</div></div>`:''}
    ${parents.length?`<div style="margin-top:8px"><dt>依赖</dt><div class="dag-tree">${parents.join('\n')}</div></div>`:''}
    ${children.length?`<div style="margin-top:4px"><dt>子任务</dt><div class="dag-tree">${children.join('\n')}</div></div>`:''}
    ${data.error?`<div class="error-block">${esc(data.error)}</div>`:''}
    <div class="detail-actions">${actions}</div>`;
  detailRow.classList.add('open');
}

// ═══════════════════════════════════════════════════════
// Decision Chain — Tab 3
// ═══════════════════════════════════════════════════════
function populateDecisionsPicker(){
  const sel=document.getElementById('dc-task-picker');
  const done=tasks.filter(t=>t.status==='done'||t.status==='failed');
  sel.innerHTML='<option value="">-- 选择已完成任务 --</option>'+
    done.map(t=>`<option value="${t.id}">${(t.id||'').slice(-8)} ${esc((t.description||'').slice(0,50))}</option>`).join('');
}

async function loadDecisions(){
  const taskId=document.getElementById('dc-task-picker').value;
  if(!taskId)return;
  const [route,pre,val]=await Promise.all([
    api(`/api/tasks/${taskId}/trace?section=route`),
    api(`/api/tasks/${taskId}/trace?section=pre_search`),
    api(`/api/tasks/${taskId}/trace?section=validation`),
  ]);

  let html='';

  // Card 1: Route
  const lvl=route.level||'?';
  const lvlC=lvl==='E'?'e-dot':lvl==='D'?'d-dot':'ep-dot';
  html+=`<div class="decision-card">
    <div class="dc-header route">路由决策 · level=<b>${lvl}</b> · type=${route.task_type||'?'} · gate=${route.gate_required?'ON':'off'}</div>
    <div class="dc-body">`;
  if(route.matched_signals&&route.matched_signals.length){
    route.matched_signals.forEach(s=>{
      let icon='▸';
      if(s.includes('complexity@1'))icon='◆';
      else if(s.includes('complexity@2'))icon='◇';
      else if(s.includes('complexity@3'))icon='○';
      else if(s.includes('降级'))icon='↓';
      else if(s.includes('gate'))icon='⚷';
      else if(s.includes('MAGMA'))icon='🧠';
      else if(s.includes('leading'))icon='⇱';
      html+=`<div class="signal-row"><span class="sig-icon">${icon}</span><span>${esc(s)}</span></div>`;
    });
  }else{html+=`<span style="color:var(--text2)">无匹配信号（默认 E）</span>`;}
  html+=`</div></div>`;

  // Card 2: Pre-Search
  if(pre&&!pre.error){
    html+=`<div class="decision-card">
      <div class="dc-header presearch">I 层预检 · ${pre.skipped?'已跳过':'已完成'}${pre.reason?` · ${esc(pre.reason)}`:''}</div>
      <div class="dc-body">`;
    if(pre.top_decisions&&pre.top_decisions.length){
      html+=`<div style="margin-bottom:6px;font-weight:600;font-size:10px">📚 知识库命中</div>`;
      pre.top_decisions.forEach(d=>{
        html+=`<div class="kb-hit">▸ <span style="color:var(--cyan)">score=${(d.score||0).toFixed(1)}</span> · ${esc((d.title||d.id||'').slice(0,60))}</div>`;
      });
    }
    if(pre.memory&&!pre.memory.error){
      const mem=pre.memory;
      html+=`<div style="margin-top:6px;font-weight:600;font-size:10px">🧠 MAGMA 记忆 · intent=${mem.intent||'?'}</div>`;
      if(mem.narrative&&mem.narrative.length){
        mem.narrative.slice(0,3).forEach(h=>{
          html+=`<div class="magma-hit">
            <span style="color:var(--purple)">${(h.score||0).toFixed(4)}</span>
            <span style="font-family:'SF Mono',monospace;font-size:10px">${(h.task_id||'').slice(-8)}</span>
            [${(h.graph_sources||[]).join(',')}]
            ${esc((h.description||'').slice(0,50))}
          </div>`;
        });
      }
      if(mem.entity_matches&&Object.keys(mem.entity_matches).length){
        html+=`<div style="margin-top:4px">📁 实体: ${Object.keys(mem.entity_matches).join(', ')}</div>`;
      }
      if(mem.graph_coverage&&Object.keys(mem.graph_coverage).length){
        html+=`<div style="color:var(--text2)">📊 图覆盖: ${Object.entries(mem.graph_coverage).map(([k,v])=>`${k}=${v}`).join(', ')}</div>`;
      }
    }
    html+=`</div></div>`;
  }

  // Card 3: Validation
  if(val&&!val.error){
    const v=val;
    html+=`<div class="decision-card">
      <div class="dc-header validation">验证结论 · ${v.verdict||'?'} · action=${v.action||'?'} · turns=${v.turns_used||0}</div>
      <div class="dc-body">

function renderIntervention(){

  document.getElementById('queue-list').innerHTML=queue.length?queue.map(t=>`
    <div class="intervention-row">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" class="q-check" value="${t.id}">
        <span style="font-family:'SF Mono',monospace;font-size:10px;color:var(--text2)">${(t.id||'').slice(-8)}</span>

      </label>
      <div style="display:flex;gap:4px">
        ${t.held
          ?`<button class="btn cyan sm" onclick="releaseTask('${t.id}')">释放</button>`
          :`<button class="btn purple sm" onclick="holdTask('${t.id}')">扣留</button>`}

      </div>
    </div>`).join(''):'<span style="color:var(--text2);font-size:11px">无排队任务</span>';

  // Active: RUNNING + DISPATCHED
  const active=tasks.filter(t=>['running','dispatched'].includes(t.status));
  document.getElementById('active-list').innerHTML=active.length?active.map(t=>`
    <div class="intervention-row">
      <span>
        <span style="font-family:'SF Mono',monospace;font-size:10px;color:var(--text2)">${(t.id||'').slice(-8)}</span>
        <span class="badge ${t.status} pulse">${STATUS_CN[t.status]||t.status}</span>
        ${esc((t.description||'').slice(0,50))}
      </span>
      <button class="btn red sm" onclick="cancelTask('${t.id}')">取消</button>
    </div>`).join(''):'<span style="color:var(--text2);font-size:11px">无活跃任务</span>';

  // Failed / retryable
  const failed=tasks.filter(t=>['failed','rolled_back'].includes(t.status));
  document.getElementById('failed-list').innerHTML=failed.length?failed.map(t=>`
    <div class="intervention-row">
      <span>
        <span style="font-family:'SF Mono',monospace;font-size:10px;color:var(--text2)">${(t.id||'').slice(-8)}</span>
        <span class="badge ${t.status}">${STATUS_CN[t.status]||t.status}</span>
        ${esc((t.description||'').slice(0,50))}
        ${t.error?`<span style="font-size:10px;color:var(--red)">${esc(t.error.slice(0,60))}</span>`:''}

      <button class="btn cyan sm" onclick="retryTask('${t.id}')">重试</button>
    </div>`).join(''):'<span style="color:var(--text2);font-size:11px">无可重试任务</span>';
}

async function loadProject(id){
  if (!id) return;
  const p = await api('/api/projects/'+id);
  if (p.error) { document.getElementById('project-detail-body').innerHTML=`<span style="color:var(--red)">${esc(p.error)}</span>`; return; }

  const labels=['模板','调研','①','架构','②','执行','③','审查','修复','④','完成'];
  const idx = phases.indexOf(p.phase);
  const bar = phases.map((ph,i)=>{
    let cls='future'; if(i<idx) cls='done'; else if(i===idx) cls='current';
    return `<span class="phase-step ${cls}">${labels[i]}</span>`;
  }).join('');
  document.getElementById('project-detail-title').innerHTML = `${esc(p.name)} <span style="font-weight:normal;font-size:9px;color:var(--text3)">${p.phase}</span>`;

      <button class="btn sm" onclick="document.getElementById('project-detail').style.display='none'">关闭</button>

}

      document.getElementById('event-section').style.display='';

}

async function setDefaultModel(id, tier){
  // 先获取当前 agents 配置
  const ag = await api('/api/agents');
  if (!ag[tier]) return;
  // 把该层所有 agent 的 default 置 false，目标置 true
  for (const a of ag[tier]) {
    const body = {default: a.model === id};
    await api('/api/agents/'+tier+'/'+a.model, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }
  renderModels();
}
async function updateModel(id, field, value){
  const body = {};
  if (field === 'tiers') {
    // toggle tier in/out
    const m = (await api('/api/models')).value || {};
    const model = Object.values(m).find(x => x.id === id);
    if (!model) return;
    const tiers = [...(model.tiers || [])];
    const idx = tiers.indexOf(value);
    if (idx >= 0) tiers.splice(idx, 1);
    else tiers.push(value);
    if (!tiers.length) return;
    body.tiers = tiers;
  } else {
    body[field] = value;
  }
  const r = await api('/api/models/'+id, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if (r.error) { /* ignore */ } else renderModels();
}

  const r=await api('/api/models/'+id,{method:'DELETE'});
  if(r.error) alert(r.error); else renderModels();
}

async function renderModels(){
  const body = document.getElementById('models-body');
  try {
    const d = await api('/api/models');
    if (d.error) { body.innerHTML = '<span style="color:var(--red)">'+esc(d.error)+'</span>'; return; }
    const models = Object.values(d);
    if (!models.length) { body.innerHTML = '<span style="color:var(--text3);font-family:var(--mono);font-size:9px">NO_MODELS_REGISTERED</span>'; return; }
    let agentData = {};
    try { agentData = await api('/api/agents'); } catch(e) {}
    const defaults = {};
    for (const [lvl, agents] of Object.entries(agentData)) {
      for (const a of agents) {
        if (a.default) { defaults[a.model] = defaults[a.model] || {}; defaults[a.model][lvl] = true; }
      }
    }
    const costMark = {budget:'_',standard:'=',premium:'≡'};
    body.innerHTML = models.map(m => {
      m._isDefault = defaults[m.id] || {};
      const tiers = (m.tiers||[]).map(t => {
        const tc = {E:'var(--cyan)','E+':'var(--orange)',D:'var(--purple)'}[t]||'var(--text3)';
        return '<span style="color:'+tc+';font-family:var(--mono);font-size:8px">'+t+'</span>';
      }).join('/');
      const dot = m.api_available
        ? '<span style="color:var(--green);font-size:7px">●</span>'
        : '<span style="color:var(--text3);font-size:7px">○</span>';
      const cm = costMark[m.cost]||'_';
      let html = '<div style="padding:4px 0;border-bottom:1px solid var(--bg3)">';
      html += '<div style="display:flex;align-items:center;gap:8px;font-size:10px">';
      html += '<span style="width:12px;text-align:center">'+dot+'</span>';
      html += '<span style="font-family:var(--mono);font-weight:500;min-width:80px;color:var(--text)">'+esc(m.display)+'</span>';
      html += '<span style="font-family:var(--mono);font-size:9px;color:var(--text3)">'+esc(m.id)+'</span>';
      html += '<span style="font-size:9px;color:var(--text3);font-family:var(--mono)">'+cm+'</span>';
      html += '<span style="font-size:8px;color:var(--text3)">'+m.speed+'</span>';
      if (m.reasoning) html += '<span style="font-size:8px;color:var(--purple);font-family:var(--mono)">RSN</span>';
      html += '<span style="flex:1"></span>';
      html += '<span style="font-size:8px;font-family:var(--mono)">'+tiers+'</span>';
      html += ' <button class="btn sm" style="color:var(--red);font-size:7px;padding:1px 3px;margin-left:4px" onclick="event.stopPropagation();removeModel(\''+esc(m.id)+'\')">DEL</button>';
      html += '</div>';
      html += '<div style="font-size:8px;color:var(--text3);margin-top:2px;font-family:var(--mono)">'+esc(m.notes||'')+'</div>';
      html += '<div style="margin-top:2px;display:flex;gap:2px">';
      for (const t of ['E','E+','D']) {
        const on = (m.tiers||[]).includes(t);
        const tc = {E:'var(--cyan)','E+':'var(--orange)',D:'var(--purple)'}[t]||'var(--text3)';
        html += '<span onclick="event.stopPropagation();updateModel(\''+esc(m.id)+'\',\'tiers\',\''+t+'\')" style="cursor:pointer;font-size:7px;font-family:var(--mono);padding:1px 4px;color:'+(on?tc:'var(--text3)')+';background:'+(on?'var(--bg3)':'transparent')+'">['+t+']</span>';
      }
      html += '<span style="font-size:7px;color:var(--text3);font-family:var(--mono)"> 层级</span>';
      for (const t of ['E','E+','D']) {
        if (!(m.tiers||[]).includes(t)) continue;
        const isDef = m._isDefault && m._isDefault[t];
        html += '<span onclick="event.stopPropagation();setDefaultModel(\''+esc(m.id)+'\',\''+t+'\')" style="cursor:pointer;font-size:7px;font-family:var(--mono);padding:1px 4px;color:'+(isDef?'var(--cyan)':'var(--text3)')+';background:'+(isDef?'rgba(57,210,192,.12)':'transparent')+'">'+(isDef?'DEF':'def')+'</span>';
      }
      html += '</div></div>';
      return html;
    }).join('');
  } catch(e) { body.innerHTML = '<span style="color:var(--red)">'+esc(e.message)+'</span>'; }
}


async function loadLineup(){
  const sel = document.getElementById('lineup-project-select');
  const pid = sel.value;
  const editor = document.getElementById('lineup-editor');
  const status = document.getElementById('lineup-status');
  if (!pid) { editor.style.display='none'; status.textContent=''; return; }

  // 加载项目 lineup
  const r = await api(`/api/projects/${pid}/lineup`);
  const lineup = (r.lineup) || {};
  // 加载可用模型列表
  const [eMods, epMods, dMods] = await Promise.all([
    api('/api/models/tier/E'), api('/api/models/tier/E+'), api('/api/models/tier/D')
  ]);

  function renderCheckboxes(tier, models, containerId){
    const c = document.getElementById(containerId);
    const selected = lineup[tier] || [];
    c.innerHTML = models.map(m => {
      const checked = selected.includes(m.id) ? 'checked' : '';
      const dot = m.api_available
        ? '<span style="color:var(--green);font-size:7px">●</span>'
        : '<span style="color:var(--text3);font-size:7px">○</span>';
      return `<label style="display:block;padding:2px 0;cursor:pointer;font-family:var(--mono);font-size:9px">
        <input type="checkbox" value="${esc(m.id)}" ${checked} onchange="lineupChanged()"
          ${m.api_available?'':'disabled'}>
        ${dot} ${esc(m.display)} <span style="color:var(--text3)">${m.cost}</span>
      </label>`;
    }).join('');
  }

  renderCheckboxes('E', eMods, 'lineup-e');
  renderCheckboxes('E+', epMods, 'lineup-ep');
  renderCheckboxes('D', dMods, 'lineup-d');
  editor.style.display = 'block';
  status.textContent = lineup && Object.keys(lineup).length ? '已有自定义编组' : '使用全局默认';
}

function lineupChanged(){
  document.getElementById('lineup-status').textContent = '已修改，待保存';
  document.getElementById('lineup-status').style.color = 'var(--orange)';
}

async function saveLineup(){
  const pid = document.getElementById('lineup-project-select').value;
  if (!pid) return;
  function getChecked(containerId){
    const c = document.getElementById(containerId);
    return [...c.querySelectorAll('input:checked')].map(cb => cb.value);
  }
  const lineup = {E: getChecked('lineup-e'), 'E+': getChecked('lineup-ep'), D: getChecked('lineup-d')};
  const r = await api(`/api/projects/${pid}/lineup`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({lineup})});
  if (r.error) { alert(r.error); return; }
  document.getElementById('lineup-status').textContent = '已保存 ✓';
  document.getElementById('lineup-status').style.color = 'var(--green)';
}

async function renderLayerSwitch(){
  const body = document.getElementById('layer-switch-body');
  const [agents, models] = await Promise.all([api('/api/agents'), api('/api/models')]);
  if (agents.error || models.error) { body.innerHTML = '<span style="color:var(--red)">加载失败</span>'; return; }

  const tiers = [
    {id:'E', color:'var(--cyan)', label:'E 层 · 日常执行', desc:'简单任务、bugfix、查询'},
    {id:'E+', color:'var(--orange)', label:'E+ 层 · 复杂构建', desc:'多文件重构、新模块、跨模块'},
    {id:'D', color:'var(--purple)', label:'D 层 · 架构设计', desc:'方案设计、安全审查、架构决策'},
  ];

  body.innerHTML = tiers.map(t => {
    const tierAgents = agents[t.id] || [];
    const activeModels = tierAgents.map(a => a.model);
    const available = Object.values(models).filter(m => (m.tiers||[]).includes(t.id));

    const checks = available.map(m => {
      const checked = activeModels.includes(m.id) ? 'checked' : '';
      const dot = m.api_available
        ? '<span style="color:var(--green);font-size:7px">●</span>'
        : '<span style="color:var(--text3);font-size:7px">○</span>';
      return `<label style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;cursor:pointer;font-size:9px;font-family:var(--mono)">
        <input type="checkbox" value="${esc(m.id)}" ${checked} onchange="toggleLayerAgent('${t.id}','${esc(m.id)}',this.checked)"
          ${m.api_available?'':'disabled'}>
        ${dot} ${esc(m.display||m.id)}
        <span style="color:var(--text3);font-size:8px">${m.cost}</span>
      </label>`;
    }).join('');

    return `<div style="padding:8px 0;border-bottom:1px solid var(--bg3)">
      <div style="font-size:10px;font-weight:600;color:${t.color};font-family:var(--mono);margin-bottom:4px">${t.label}</div>
      <div style="display:flex;flex-wrap:wrap;gap:2px">${checks||'<span style="color:var(--text3);font-size:9px">该层无可用模型</span>'}</div>
    </div>`;
  }).join('');
}

async function toggleLayerAgent(tier, modelId, enable){
  if (enable) {
    // Add to this layer: clone from existing config or create new
    await api('/api/agents', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({level:tier,model:modelId})});
  } else {
    await api('/api/agents/'+tier+'/'+modelId, {method:'DELETE'});
  }
  renderLayerSwitch();
}

async function populateLineupProjects(){
  const sel = document.getElementById('lineup-project-select');
  try {
    const r = await api('/api/projects');
    const projects = r.projects || [];
    sel.innerHTML = '<option value="">— 选择项目 —</option>' +
      projects.map(p => `<option value="${esc(p.id)}">${esc(p.name)} (${p.phase})</option>`).join('');
  } catch(e) {}
}
