<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇点调度器 · 实时看板</title>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --border: #30363d; --text: #e6edf3; --text2: #8b949e;
  --green: #3fb950; --red: #f85149; --yellow: #d2991d;
  --blue: #58a6ff; --purple: #bc8cff; --cyan: #39d2c0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:24px; min-height:100vh;
}
h1 { font-size:20px; font-weight:600; margin-bottom:20px; color:var(--cyan); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
.card {
  background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:16px;
}
.card h2 { font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px; }
.stat-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); }
.stat-row:last-child { border-bottom:none; }
.stat-label { font-size:13px; color:var(--text2); }
.stat-value { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.dot-green { background:var(--green); }
.dot-red { background:var(--red); }
.dot-yellow { background:var(--yellow); }
.bar-wrap { height:6px; background:var(--bg3); border-radius:3px; margin-top:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; transition:width .3s; }
.bar-green { background:var(--green); }
.bar-yellow { background:var(--yellow); }
.bar-red { background:var(--red); }
.bar-blue { background:var(--blue); }
.event-log {
  max-height:300px; overflow-y:auto; font-size:12px; font-family:'SF Mono',monospace;
  background:var(--bg); border-radius:6px; padding:10px;
}
.event-log .line { padding:3px 0; border-bottom:1px solid #ffffff08; display:flex; gap:8px; }
.event-log .time { color:var(--text2); flex-shrink:0; }
.event-log .type { color:var(--cyan); flex-shrink:0; min-width:50px; }
.event-log .msg { color:var(--text); word-break:break-all; }
.tag {
  display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:500;
}
.tag-e { background:#1a3a2a; color:var(--green); }
.tag-ep { background:#2a2a1a; color:var(--yellow); }
.tag-d { background:#2a1a3a; color:var(--purple); }
.connecting { color:var(--yellow); font-size:12px; }
.connected { color:var(--green); font-size:12px; }
.error-state { color:var(--red); font-size:12px; }
#sse-status { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; margin-left:8px; }
#sse-status.connected { background:#1a3a2a; }
#sse-status.disconnected { background:#3a1a1a; color:var(--red); }
</style>
</head>
<body>

<h1>
  奇点调度器
  <span id="sse-status" class="disconnected">● 离线</span>
</h1>

<div class="grid">
  <!-- 健康状态 -->
  <div class="card">
    <h2>🫀 健康</h2>
    <div id="health-stats">
      <div class="stat-row"><span class="stat-label">服务</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">磁盘</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">调度循环</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">SSE 客户端</span><span class="stat-value">—</span></div>
    </div>
  </div>

  <!-- 任务队列 -->
  <div class="card">
    <h2>📋 任务队列</h2>
    <div id="task-counts">
      <div class="stat-row"><span class="stat-label">待处理</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">运行中</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">已完成</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">失败</span><span class="stat-value">—</span></div>
    </div>
  </div>

  <!-- Token 消耗 -->
  <div class="card">
    <h2>💰 Token 消耗</h2>
    <div id="token-stats">
      <div class="stat-row"><span class="stat-label">E 层</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">E+ 层</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">D 层</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">总计</span><span class="stat-value">—</span></div>
    </div>
  </div>

  <!-- Agent 状态 -->
  <div class="card">
    <h2>🤖 Agent</h2>
    <div id="agent-stats">
      <div class="stat-row"><span class="stat-label">模型数</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">E 层 agent</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">E+ 层 agent</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">D 层 agent</span><span class="stat-value">—</span></div>
    </div>
  </div>

  <!-- 模型负载 -->
  <div class="card">
    <h2>📊 耗时</h2>
    <div id="perf-stats">
      <div class="stat-row"><span class="stat-label">平均等待</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">平均完成</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">卡住任务</span><span class="stat-value">—</span></div>
    </div>
  </div>

  <!-- 项目 -->
  <div class="card">
    <h2>📁 项目</h2>
    <div id="project-stats">
      <div class="stat-row"><span class="stat-label">项目数</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">进行中</span><span class="stat-value">—</span></div>
      <div class="stat-row"><span class="stat-label">已完成</span><span class="stat-value">—</span></div>
    </div>
  </div>
</div>

<!-- 实时事件流 -->
<div class="card" style="margin-top:16px;">
  <h2>📡 实时事件</h2>
  <div class="event-log" id="event-log">
    <div class="line"><span class="time">--:--:--</span><span class="type">system</span><span class="msg">等待连接…</span></div>
  </div>
</div>

<script>
const BASE = 'http://127.0.0.1:5050';
const $ = id => document.getElementById(id);

function fmt(n) {
  if (n == null) return '—';
  if (typeof n === 'number') {
    if (n > 1e6) return (n/1e6).toFixed(2)+'M';
    if (n > 1e3) return (n/1e3).toFixed(1)+'K';
    return n.toFixed(0);
  }
  return n;
}

function nowStr() {
  return new Date().toLocaleTimeString('zh-CN',{hour12:false});
}

function addEvent(type, msg) {
  const log = $('event-log');
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `<span class="time">${nowStr()}</span><span class="type">${type}</span><span class="msg">${msg}</span>`;
  log.prepend(div);
  if (log.children.length > 50) log.lastElementChild.remove();
}

// ── 拉取一次性状态 ──
async function refresh() {
  try {
    const [health, status, agents, projects] = await Promise.all([
      fetch(BASE+'/health').then(r=>r.json()).catch(()=>null),
      fetch(BASE+'/api/status').then(r=>r.json()).catch(()=>null),
      fetch(BASE+'/api/agents').then(r=>r.json()).catch(()=>null),
      fetch(BASE+'/api/projects').then(r=>r.json()).catch(()=>null),
    ]);

    // 健康
    if (health) {
      $('health-stats').innerHTML = `
        <div class="stat-row"><span class="stat-label">服务</span><span class="stat-value"><span class="dot dot-green"></span>${health.status||'?'}</span></div>
        <div class="stat-row"><span class="stat-label">磁盘</span><span class="stat-value">${fmt(health.disk_free_mb)} MB</span></div>
        <div class="stat-row"><span class="stat-label">调度循环</span><span class="stat-value">${health.loop_running?'<span class="dot dot-green"></span>运行中':'<span class="dot dot-red"></span>已停止'}</span></div>
        <div class="stat-row"><span class="stat-label">SSE 客户端</span><span class="stat-value">${health.sse_clients||0}</span></div>
      `;
    }

    // 任务
    if (status && status.counts) {
      const c = status.counts;
      const total = Object.values(c).reduce((a,b)=>a+b,0);
      $('task-counts').innerHTML = `
        <div class="stat-row"><span class="stat-label"><span class="dot dot-yellow"></span>待处理</span><span class="stat-value">${c.pending||0}</span><div class="bar-wrap"><div class="bar-fill bar-yellow" style="width:${total?c.pending/total*100:0}%"></div></div></div>
        <div class="stat-row"><span class="stat-label"><span class="dot dot-green"></span>运行中</span><span class="stat-value">${c.running||0}</span><div class="bar-wrap"><div class="bar-fill bar-green" style="width:${total?c.running/total*100:0}%"></div></div></div>
        <div class="stat-row"><span class="stat-label">已完成</span><span class="stat-value">${c.done||0}</span></div>
        <div class="stat-row"><span class="stat-label">失败</span><span class="stat-value">${c.failed||0}</span></div>
      `;
    }

    // Token
    if (status && status.token_totals) {
      const t = status.token_totals;
      const total = Object.values(t).reduce((a,b)=>a+b,0);
      $('token-stats').innerHTML = `
        <div class="stat-row"><span class="stat-label"><span class="tag tag-e">E</span></span><span class="stat-value">${fmt(t.E||0)}</span></div>
        <div class="stat-row"><span class="stat-label"><span class="tag tag-ep">E+</span></span><span class="stat-value">${fmt(t['E+']||0)}</span></div>
        <div class="stat-row"><span class="stat-label"><span class="tag tag-d">D</span></span><span class="stat-value">${fmt(t.D||0)}</span></div>
        <div class="stat-row"><span class="stat-label">总计</span><span class="stat-value">${fmt(total)}</span></div>
      `;
    }

    // Agent
    if (agents && agents.agents) {
      const ag = agents.agents;
      const counts = {};
      ag.forEach(a => { counts[a.level] = (counts[a.level]||0)+1; });
      $('agent-stats').innerHTML = `
        <div class="stat-row"><span class="stat-label">模型数</span><span class="stat-value">${ag.length}</span></div>
        <div class="stat-row"><span class="stat-label"><span class="tag tag-e">E</span></span><span class="stat-value">${counts.E||0} agent</span></div>
        <div class="stat-row"><span class="stat-label"><span class="tag tag-ep">E+</span></span><span class="stat-value">${counts['E+']||0} agent</span></div>
        <div class="stat-row"><span class="stat-label"><span class="tag tag-d">D</span></span><span class="stat-value">${counts.D||0} agent</span></div>
      `;
    }

    // 耗时
    if (status) {
      $('perf-stats').innerHTML = `
        <div class="stat-row"><span class="stat-label">平均等待</span><span class="stat-value">${status.avg_wait||'—'}</span></div>
        <div class="stat-row"><span class="stat-label">平均完成</span><span class="stat-value">${status.avg_done||'—'}</span></div>
        <div class="stat-row"><span class="stat-label">卡住任务</span><span class="stat-value">${(status.stalled||[]).length}</span></div>
      `;
    }

    // 项目
    if (projects && projects.projects) {
      const ps = projects.projects;
      const active = ps.filter(p=>!['done','archived'].includes(p.phase)).length;
      const done = ps.filter(p=>p.phase==='done').length;
      $('project-stats').innerHTML = `
        <div class="stat-row"><span class="stat-label">项目数</span><span class="stat-value">${ps.length}</span></div>
        <div class="stat-row"><span class="stat-label">进行中</span><span class="stat-value">${active}</span></div>
        <div class="stat-row"><span class="stat-label">已完成</span><span class="stat-value">${done}</span></div>
      `;
    }

    $('sse-status').className = 'connected';
    $('sse-status').innerHTML = '● 在线';
    addEvent('refresh', '状态已更新');
  } catch(e) {
    addEvent('error', '无法连接 127.0.0.1:5050');
  }
}

// ── SSE 实时事件 ──
function connectSSE() {
  try {
    const es = new EventSource(BASE+'/api/events');
    es.onopen = () => {
      $('sse-status').className = 'connected';
      $('sse-status').innerHTML = '● 在线';
      addEvent('sse', 'SSE 已连接');
    };
    es.addEventListener('task', e => { try { const d=JSON.parse(e.data); addEvent('task', `#${d.task_id?.slice(0,8)}: ${d.event||d.status||'更新'}`); } catch(_){} });
    es.addEventListener('system', e => { try { const d=JSON.parse(e.data); addEvent('system', d.message||e.data); } catch(_){} });
    es.addEventListener('tool:start', e => { try { const d=JSON.parse(e.data); addEvent('🔧开始', d.tool||e.data); } catch(_){} });
    es.addEventListener('tool:done', e => { try { const d=JSON.parse(e.data); addEvent('🔧完成', d.tool||e.data); } catch(_){} });
    es.addEventListener('turn', e => { try { const d=JSON.parse(e.data); addEvent('🔄轮次', `第${d.turn}轮`); } catch(_){} });
    es.onerror = () => {
      $('sse-status').className = 'disconnected';
      $('sse-status').innerHTML = '● 离线';
      addEvent('sse', '连接断开，5s 后重连');
      es.close();
      setTimeout(connectSSE, 5000);
    };
  } catch(e) {
    setTimeout(connectSSE, 5000);
  }
}

// 启动
refresh();
connectSSE();
setInterval(refresh, 30000); // 每 30s 全量刷新兜底
</script>
</body>
</html>
