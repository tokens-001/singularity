name: Test

on: [push, pull_request]

# ⚠️ **拆成两个 job 是故意的，别merge回去**（2026-09-19 改）。
#
# 原来这 6 步串在**同一个 job** 里，而第 2 步 `ruff` 一红 ⇒ 后面 4 步**全部 skipped**。
# 后果实测（`gh run list`）：**117 次运行全 failure**（09-04 → 09-18），
# 其中 `pytest`、`test_exec_run`、`mypy` **一次都没跑过** ——
# 「1645 条测试全绿」是一句**只在本机成立、第三方通过仓库自己的自动化复核不了**的话。
#
# 拆开之后：lint 的红**不再掩盖**测试的结果。lint 那一半仍然红（1021 条规则债，
# 见 `docs/CI与发布审计-20260919.md`），但它是**诚实地红**，而且不再吃掉真信号。
# ⚠️ 别为了让它变绿改成 `|| true` 或 `continue-on-error` —— 那是把红藏起来，
#    本仓 `docs/防御模式.md` §78 自己写着「假门比没门坏」。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 和 `Makefile:lint` **必须是同一条命令**（2026-09-19 统一）。
      # 原来这里写的是 `ruff check src/ --select=E,F`，和本机那条三处都不一样：
      #   路径 `src/` vs `src/singularity/` · 规则集 `--select` 手挑 vs 走 pyproject ·
      #   **而且 `--select` 会重开项目自己 ignore 的 E501**（75 条，`pyproject.toml:51`）。
      # ⇒ 两个入口互不预测，`make check` 于是恒不可运行。
      - run: ruff check src/singularity/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: QIDIAN_SKIP_EMBED=1 python3 tests/test_imports.py
      - run: QIDIAN_SKIP_EMBED=1 python3 -m pytest tests/test_scheduler/ -q --cov=singularity --cov-report=term --cov-fail-under=20
      - run: QIDIAN_SKIP_EMBED=1 python3 tests/test_exec_run.py
      # mypy 那一步已删（2026-09-19），原因是它**结构上不可能失败**：
      #   mypy src/singularity/ --ignore-missing-imports || true
      # `|| true` 让它永远退出 0 —— 它从来不是「宽松的检查」，是个**假门**。
      # 要加回来：① 先让它在**本机跑干净**（现在本机压根没装 mypy）② 再去掉 `|| true` 加回来；
      # 加的时候**必须同时处理** `pyproject.toml` 的 `[tool.mypy] exclude` ——
      # 它整块屏蔽 `executors/` / `neijinglu.py` / `supervisor.py`。
      # ⚠️ 这两件事是**耦合**的：mypy 恒不卡时那个 exclude 一点后果都没有；
      #    **只有 `|| true` 去掉之后，它才变成承重墙上的盲区**。分开修等于没修。

  # 审计脚本接电（2026-09-20）。**必须单独一个 job**，理由同上面拆 job 那次：
  # 串进去的话 lint 一红就把审计 skip 掉，而审计恰恰是「其它判断的地基」那一步。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 **必须 0**：`scripts/test_preflight.py` 的成绩单是拿 `git archive <sha>`
          # 取历史那些树来扫的（312584b / 905a5dd …）。默认 fetch-depth: 1 只有 HEAD，
          # 那些 rev 一个都取不到 ⇒ 脚本直接 RuntimeError 红掉，而且红得**莫名其妙**
          # （看起来像"工具坏了"，其实是没喂历史）。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 和 Makefile 的 `audit` **同两条命令**，别在这儿另写一套判据。
      - run: python scripts/test_preflight.py
      - run: python scripts/test_delivery_facts.py
      - run: python scripts/test_dispatch.py
      - run: python scripts/preflight.py shapes --baseline scripts/preflight-baseline.json
