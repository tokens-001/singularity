[custom]
# v2 融合只认这一个键：把 N 份方案里的共识/分歧抽出来的「提取员」。
#
# 这里原来是 `judge_model` + `call_model` —— 都是 **v1 的角色名，v2 全仓没有任何地方读**
# （v2 没有裁判，定稿人由 `_pick_writer` 从委员里选）。改名之后没人把活键补回来，
# 于是永远静默走 `execution_judge.py` 里的硬编码默认值。
#
# 代价是实打实的：默认值偏偏是 `glm-5.3-flash`（智谱），智谱一欠费它就
# 连撞两个 429、最后退到委员会成员身上 —— 实测「提取」这一步单独烧掉 170 秒，
# 整场融合 621 秒。
#
# 选它的权衡：提取是机械活，要的是**快**、不是强。
#
# ⚠️ **2026-09-12 更新 —— 下面两句原来的描述已经不成立**（留着是因为回退就会重新踩上）：
# 原文写「它同时是委员会成员（手上能用的模型就这三个）…提取员当委员 = 自己评自己」。
# 现状（§62 扩池之后）：
#   · 取值优先级是 **阶段配置 > 本文件 > 代码默认**。`extract` 阶段现在配的是
#     **glm-5.2**，所以**这个键目前根本没被读到**；
#   · glm-5.2 **不在委员会里** —— 委员会被 `phase_models.for_phase("planning")`
#     显式锁死为 deepseek-flash + glm-5.3-flash，加模型带不进去。
#   ⇒ "提取员当委员"这个降级**已经消掉了**，`extractor_is_member_fallback` 不该再报。
# **但这只对"阶段配置还在"成立** —— 谁把 `phase_models.json` 的 extract 清空，
# 就退到本文件这一行，重叠问题原样回来。
#
# 另一处更正：原文说"用非思考模型"。那条纪律**没有任何地方执行它**
# （兜底表两个都是思考模型，glm-5.2 也是）—— 真实要求是"别把 max_tokens 烧在
# reasoning 上"，见 execution_judge.py 里 `_V2_EXTRACT_MAX_TOKENS` 那段的注释。
extract_model = "deepseek-flash"
