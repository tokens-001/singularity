<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        
        .timer-display {
            font-size: 6rem;
            font-weight: 300;
            margin-bottom: 2rem;
            color: #333;
            font-family: 'Courier New', monospace;
        }
        
        .mode-indicator {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            background-color: #f0f0f0;
            color: #333;
        }
        
        button:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.active {
            background-color: #4CAF50;
            color: white;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            margin: 2rem 0;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 100%;
            transition: width 1s linear;
        }
        
        .session-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            color: #999;
        }
        
        @media (max-width: 600px) {
            .timer-display {
                font-size: 4rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mode-indicator" id="mode">专注时间</div>
        <div class="timer-display" id="time">25:00</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="controls">
            <button id="startBtn">开始</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
        </div>
        
        <div class="session-info">
            <div>专注: <span id="focusCount">0</span> 次</div>
            <div>休息: <span id="breakCount">0</span> 次</div>
        </div>
    </div>

    <script>
        class TomatoTimer {
            constructor() {
                this.workTime = 25 * 60; // 25 minutes in seconds
                this.breakTime = 5 * 60; // 5 minutes in seconds
                
                this.timeLeft = this.workTime;
                this.currentMode = 'work'; // 'work' or 'break'
                this.isRunning = false;
                this.intervalId = null;
                
                this.focusCount = 0;
                this.breakCount = 0;
                
                this.initializeElements();
                this.bindEvents();
                this.updateDisplay();
            }
            
            initializeElements() {
                this.timeDisplay = document.getElementById('time');
                this.modeDisplay = document.getElementById('mode');
                this.startBtn = document.getElementById('startBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.progressFill = document.getElementById('progress');
                this.focusCountEl = document.getElementById('focusCount');
                this.breakCountEl = document.getElementById('breakCount');
            }
            
            bindEvents() {
                this.startBtn.addEventListener('click', () => this.start());
                this.pauseBtn.addEventListener('click', () => this.pause());
                this.resetBtn.addEventListener('click', () => this.reset());
            }
            
            start() {
                if (this.isRunning) return;
                
                this.isRunning = true;
                this.startBtn.classList.add('active');
                
                this.intervalId = setInterval(() => {
                    this.tick();
                }, 1000);
            }
            
            pause() {
                this.isRunning = false;
                this.startBtn.classList.remove('active');
                
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
            }
            
            reset() {
                this.pause();
                
                if (this.currentMode === 'work') {
                    this.timeLeft = this.workTime;
                } else {
                    this.timeLeft = this.breakTime;
                }
                
                this.updateDisplay();
                this.updateProgress();
            }
            
            tick() {
                if (this.timeLeft <= 0) {
                    this.completeCurrentSession();
                    return;
                }
                
                this.timeLeft--;
                this.updateDisplay();
                this.updateProgress();
            }
            
            completeCurrentSession() {
                if (this.currentMode === 'work') {
                    // 完成一个专注周期
                    this.focusCount++;
                    this.currentMode = 'break';
                    this.timeLeft = this.breakTime;
                    alert('专注时间结束！现在是休息时间！');
                } else {
                    // 完成一个休息周期
                    this.breakCount++;
                    this.currentMode = 'work';
                    this.timeLeft = this.workTime;
                    alert('休息时间结束！开始新的专注时间！');
                }
                
                this.updateDisplay();
                this.updateProgress();
                
                // 自动开始下一阶段
                this.pause();
                this.start();
            }
            
            updateDisplay() {
                const minutes = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
                const seconds = (this.timeLeft % 60).toString().padStart(2, '0');
                
                this.timeDisplay.textContent = `${minutes}:${seconds}`;
                this.modeDisplay.textContent = this.currentMode === 'work' ? '专注时间' : '休息时间';
                
                this.focusCountEl.textContent = this.focusCount;
                this.breakCountEl.textContent = this.breakCount;
            }
            
            updateProgress() {
                let totalTime;
                if (this.currentMode === 'work') {
                    totalTime = this.workTime;
                } else {
                    totalTime = this.breakTime;
                }
                
                const progressPercent = ((totalTime - this.timeLeft) / totalTime) * 100;
                this.progressFill.style.width = `${progressPercent}%`;
            }
        }
        
        // Initialize the timer when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new TomatoTimer();
        });
    </script>
</body>
</html>
