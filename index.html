<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25:00 - 番茄钟</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 35%, #d4b8f5 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.06);
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title {
    font-size: 20px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 32px;
    letter-spacing: 1px;
  }

  .timer-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }

  .progress-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: #e2e8f0;
    stroke-width: 8;
  }

  .ring-progress {
    fill: none;
    stroke: #4ade80;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.95s linear, stroke 1s ease;
  }

  .time-display {
    font-size: 100px;
    font-weight: 800;
    color: #2d3748;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 1;
    user-select: none;
  }

  .controls {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
  }

  .btn {
    padding: 14px 36px;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 120px;
  }

  .btn:active {
    transform: scale(0.96);
  }

  .btn-primary {
    background: #6366f1;
    color: #fff;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
  }

  .btn-primary:hover {
    background: #4f46e5;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
  }

  .btn-secondary {
    background: #f1f5f9;
    color: #475569;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
  }

  .btn-secondary:hover {
    background: #e2e8f0;
    color: #334155;
  }

  .pomodoro-count {
    font-size: 18px;
    font-weight: 600;
    color: #64748b;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pomodoro-count .icon {
    font-size: 24px;
  }

  .pomodoro-count .count {
    color: #6366f1;
    font-size: 22px;
    font-weight: 800;
  }

  /* Toast 提示 */
  .toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: #1e293b;
    color: #fff;
    padding: 18px 40px;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 600;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast .toast-icon {
    font-size: 26px;
  }

  @media (max-width: 480px) {
    .card {
      padding: 36px 24px 32px;
    }

    .timer-wrap {
      width: 240px;
      height: 240px;
    }

    .time-display {
      font-size: 72px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 15px;
      min-width: 100px;
    }

    .controls {
      gap: 12px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">🍅 番茄钟</div>

    <div class="timer-wrap">
      <svg class="progress-ring" viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="130"></circle>
        <circle class="ring-progress" cx="140" cy="140" r="130"></circle>
      </svg>
      <div class="time-display" id="timeDisplay">25:00</div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">开始</button>
      <button class="btn btn-secondary" id="resetBtn">重置</button>
    </div>

    <div class="pomodoro-count">
      <span class="icon">🍅</span>
      <span>已完成</span>
      <span class="count" id="count">0</span>
      <span>个番茄</span>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon">⏰</span>
    <span>时间到！</span>
  </div>

<script>
  // ========== 常量 ==========
  const TOTAL_SECONDS = 25 * 60;          // 番茄钟总时长
  const RING_RADIUS = 130;                 // SVG 圆半径
  const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

  // ========== DOM ==========
  const timeDisplay   = document.getElementById('timeDisplay');
  const startBtn      = document.getElementById('startBtn');
  const resetBtn      = document.getElementById('resetBtn');
  const countEl       = document.getElementById('count');
  const ringProgress  = document.querySelector('.ring-progress');
  const toast         = document.getElementById('toast');

  // ========== 状态 ==========
  let remaining   = TOTAL_SECONDS;
  let isRunning   = false;
  let timerId     = null;
  let pomodoroCount = 0;

  // ========== 初始化进度环 ==========
  ringProgress.style.strokeDasharray  = RING_CIRCUMFERENCE;
  ringProgress.style.strokeDashoffset = 0;

  // ========== 工具函数 ==========
  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function getRingColor(sec) {
    if (sec <= 300) return '#ef4444';   // 最后 5 分钟 → 红色
    if (sec <= 900) return '#facc15';   // 最后 15 分钟 → 黄色
    return '#4ade80';                    // 默认 → 绿色
  }

  function updateDisplay() {
    const text = formatTime(remaining);
    timeDisplay.textContent = text;
    document.title = `${text} - 番茄钟`;
  }

  function updateRing() {
    const progress   = remaining / TOTAL_SECONDS;
    const offset     = RING_CIRCUMFERENCE * (1 - progress);
    ringProgress.style.strokeDashoffset = offset;
    ringProgress.style.stroke = getRingColor(remaining);
  }

  // ========== Web Audio API 蜂鸣声 ==========
  let audioCtx = null;

  function playBeep() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const now = audioCtx.currentTime;

    // 连续三声短蜂鸣
    for (let i = 0; i < 3; i++) {
      const t = now + i * 0.35;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t);   // A5 音高

      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
      gain.gain.linearRampToValueAtTime(0, t + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 0.3);
    }
  }

  // ========== Toast 提示 ==========
  let toastTimer = null;

  function showToast() {
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  // ========== 计时器逻辑 ==========
  function tick() {
    remaining--;
    updateDisplay();
    updateRing();

    if (remaining <= 0) {
      finish();
    }
  }

  function finish() {
    clearInterval(timerId);
    timerId = null;
    isRunning = false;
    startBtn.textContent = '开始';
    remaining = TOTAL_SECONDS;

    pomodoroCount++;
    countEl.textContent = pomodoroCount;

    playBeep();
    showToast();

    updateDisplay();
    updateRing();
  }

  // ========== 按钮事件 ==========
  startBtn.addEventListener('click', () => {
    if (isRunning) {
      // 暂停
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      startBtn.textContent = '继续';
    } else {
      // 开始 / 继续
      // 首次用户交互时激活 AudioContext
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isRunning = true;
      startBtn.textContent = '暂停';
      timerId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(timerId);
    timerId = null;
    isRunning = false;
    remaining = TOTAL_SECONDS;
    startBtn.textContent = '开始';
    updateDisplay();
    updateRing();
  });

  // ========== 键盘快捷键 ==========
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      startBtn.click();
    } else if (e.code === 'KeyR') {
      resetBtn.click();
    }
  });

  // ========== 初始化 ==========
  updateDisplay();
  updateRing();
</script>
</body>
</html>
