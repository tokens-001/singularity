<h1>奇点 — 模块耦合矩阵（边来自 ast 解析）</h1>
<p class="sub">
 行 = 依赖方，列 = 被依赖方，格子里的数字 = 跨组 import 次数（空格 = 无依赖）。
 组按总交互量排序，所以相关的东西挨在一起。
 <b>分组规则是我的判断</b>（按文件名前缀归并），<b>数字是代码里真实的 import</b>。<br>
 注意 <code>模型/基础设施</code> 那一<b>列</b>——几乎所有行都有值，说明它是被所有人依赖的底座。
</p>
