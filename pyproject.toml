[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity"
version = "2.1.156"
description = "Singularity Agent Dispatch Platform"
# ⚠️ 地板 **3.12**，不是 3.11（2026-09-14 拍板、用户点"提到 3.12"）。
# 理由不是"新特性"，是**声明要和实际一致**：两个真实环境是 3.12（Dockerfile 的
# python:3.12-slim）和 3.14（本机），**没有任何东西在 3.11 上跑过**。
# 一个没人测过的地板是"承诺了你兑不了的东西" —— 上次那个洞就踩在这条假地板上：
# `unittest discover` 在 0 个测试时 **3.11 及以下 rc=0**（`Ran 0 tests` + `OK`）、
# **3.12 起才是 rc=5**（`NO TESTS RAN`），于是"一个测试都没有"被 QA 门报成"通过"。
# 那条已在 `validator.run_project_tests` 里**按版本无关**的方式修掉（匹配串补一句），
# 这里把地板提上来是第二层：声明的地板从此就是有人真跑过的那个版本。
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "Flask>=3.0",
    "httpx>=0.28",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "chromadb>=0.4",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    # `pre-commit` 已删（2026-09-19）：根目录**从来没有** `.pre-commit-config.yaml`，
    # `.git/hooks/` 里只有 sample、`core.hooksPath` 也没配 ⇒ 这条依赖声明的那个
    # 「本地钩子门」**从未存在过**。要么给 config、要么删依赖，这里选删 ——
    # ⚠️ 而现在**不该加 config**：lint 有 1021 条规则债，装了等于每次提交都在本地红，
    # 那是把「假门」换成「堵死路的门」。等 lint 债还到能绿，再把两边一起加回来。
]

[project.scripts]
singularity = "singularity.web.app:main"
singularity-cli = "singularity.scheduler.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["singularity*", "observer*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# ⚠️ 每一条豁免都要有**具体理由**，不许为了"让门变绿"批量塞
# （那是把红藏起来，本仓 `docs/防御模式.md` §78 写着"假门比没门坏"）。
# 2026-09-19 把 lint 债从 1021 清到 0 时，逐条过了剩下的 93 条，
# 下面四条是**判定不该按默认修法改**的，其余全部真修了。
ignore = [
    "E501",   # 行太长（原有）—— line-length 已在上面设成 120
    "B904",   # raise ... from err（原有）
    "E402",   # 「import 必须在顶部」—— 本仓**故意**不是：
              #   · `web/app.py` 要先读 `.env` 再导调度器（调度器在 import 期读环境变量）
              #   · `_api.py` / `observer_agent.py` / `memory.py` / `__main__.py` 用
              #     **底部星号导入**做门面再导出（见那些文件顶部的说明）
              #   · 多处要 `sys.path` 或常量先就位
              #   挪到顶部会改变导入顺序，是**行为变更**不是风格
    "SIM105", # 「try/except/pass 应换成 contextlib.suppress」—— **本仓改不了**：
              #   本仓有一台自己的守卫管这件事（`tests/test_scheduler/test_no_silent_except.py`，
              #   按 `(文件, 函数)` 计数的**静默 except 棘轮**，任何增减都红），
              #   而它的 docstring 明写 **`contextlib.suppress` 同罪、一并计数**。
              #   ⇒ 换成 suppress 等于把红从 ruff 挪到那台守卫上，**原地打转**。
              #   留着这条至少还看得见；要动得先决定"这些吞噬到底该不该出声"。
    "N815",   # mixedCase in class scope —— `mcp.py` 的 `inputSchema` 不是变量名，
              #   是 **MCP 协议的字段名**，改名会破坏与客户端的协议
    "UP042",  # `class Phase(str, Enum)` → `StrEnum` —— **那是行为变更**：
              #   `str(Phase.X)` 从 `'Phase.X'` 变成 `'x'`。Phase 是核心枚举，
              #   覆盖面靠测试保证不了（`project.py:607/645` 有 `str(phase)` 的兜底用法）。
              #   要改得单独一轮 + 真机验，不该混在清 lint 债里顺手改。
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["src/singularity/scheduler/executors/", "src/singularity/scheduler/neijinglu\\.py", "src/singularity/scheduler/supervisor\\.py"]

[tool.coverage.run]
source = ["src/singularity"]
branch = true

[tool.coverage.report]
exclude_also = ["def __repr__", "if __name__ == .__main__.:", "raise NotImplementedError"]
